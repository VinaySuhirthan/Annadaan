<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Annadaan — Every Plate Counts</title>

  <style>
    /* --- Global Styles from index.css --- */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --primary: #2D6A4F;
      --primary-light: #40916C;
      --primary-dark: #1B4332;
      --secondary: #52B788;
      --accent: #B7E4C7;
      --background: #F8FAF9;
      --surface: #FFFFFF;
      --text-main: #1A1C1E;
      --text-muted: #64748B;
      --error: #EF4444;
      --success: #10B981;
      --warning: #F59E0B;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-premium: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;

      --bg-main: #ffffff;
      --acc-soft: #f0fdf4;
      --acc-bright: #2d6a4f;
      --acc-glow: rgba(45, 106, 79, 0.15);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    .animate-fade-in {
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* --- End Global Styles --- */

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-main);
      font-family: 'Inter', sans-serif;
    }

    /* Immersive Mesh Background */
    .mesh-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background: #ffffff;
    }

    .mesh-bg div {
      position: absolute;
      filter: blur(80px);
      border-radius: 50%;
      opacity: 0.4;
      animation: move 20s infinite alternate cubic-bezier(0.45, 0, 0.55, 1);
    }

    .blob1 {
      width: 400px;
      height: 400px;
      background: #dcfce7;
      top: -10%;
      right: -5%;
      animation-delay: 0s;
    }

    .blob2 {
      width: 350px;
      height: 350px;
      background: #f0fdf4;
      bottom: -5%;
      left: -5%;
      animation-delay: -5s;
    }

    .blob3 {
      width: 300px;
      height: 300px;
      background: #fef9c3;
      top: 30%;
      left: 20%;
      animation-delay: -10s;
    }

    @keyframes move {
      0% {
        transform: translate(0, 0) scale(1);
      }

      100% {
        transform: translate(50px, 100px) scale(1.1);
      }
    }

    .main-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10vh 24px 80px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }

    /* Logo Area */
    .brand-stage {
      position: relative;
      margin-bottom: 12px;
      perspective: 1000px;
    }

    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-70%, -70%);
      width: 120px;
      /* Reduced further */
      height: 120px;
      background: radial-gradient(circle, var(--acc-soft) 0%, transparent 70%);
      z-index: -1;
      animation: pulseGlow 4s infinite;
    }

    .logo-main {
      width: clamp(120px, 18vh, 160px);
      height: auto;
      filter: drop-shadow(0 20px 40px var(--acc-glow));
      /* animation: floatLogo 6s ease-in-out infinite; REMOVED per user request */
    }

    @keyframes pulseGlow {

      0%,
      100% {
        opacity: 0.5;
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1.2);
      }
    }

    /* Animation removed from usage, keyframes kept just in case or can be removed */
    @keyframes floatLogo {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* Typography */
    .badge {
      background: rgba(45, 106, 79, 0.08);
      color: var(--acc-bright);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
      /* Tightened gap to logo */
      backdrop-filter: blur(4px);
      border: 1px solid rgba(45, 106, 79, 0.1);
    }

    h1 {
      font-size: clamp(32px, 6vh, 48px);
      font-weight: 800;
      line-height: 0.95;
      margin: 0 0 8px;
      color: #1a1a1a;
      letter-spacing: -2.5px;
      text-align: center;
    }

    h1 span {
      display: block;
      background: linear-gradient(135deg, #2d6a4f 0%, #52b788 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .desc {
      font-size: 15px;
      color: #64748b;
      max-width: 90%;
      margin-bottom: 20px;
      line-height: 1.5;
      font-weight: 500;
      text-align: center;
    }

    /* High-End Cards */
    .action-stack {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: -8px;
    }

    .card-btn {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      padding: 20px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
      position: relative;
      overflow: hidden;
    }

    .card-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: 0.5s;
    }

    .card-btn:hover::before {
      left: 150%;
    }

    .card-btn:hover {
      transform: translateY(-5px) scale(1.02);
      background: #ffffff;
      box-shadow: 0 20px 40px rgba(45, 106, 79, 0.08);
      border-color: rgba(45, 106, 79, 0.2);
    }

    .icon-box {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: #f0fdf4;
      color: #2d6a4f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.3s;
    }

    .card-btn:hover .icon-box {
      background: #2d6a4f;
      color: #ffffff;
      transform: rotate(5deg);
    }

    .card-txt {
      text-align: left;
      flex: 1;
    }

    .card-txt b {
      font-size: 18px;
      color: #1a1a1a;
      display: block;
      margin-bottom: 2px;
    }

    .card-txt p {
      font-size: 13px;
      color: #64748b;
      margin: 0;
      font-weight: 500;
    }

    .next-icon {
      color: #2d6a4f;
      opacity: 0.3;
      transition: transform 0.3s;
    }

    .card-btn:hover .next-icon {
      transform: translateX(4px);
      opacity: 1;
    }

    /* Minimal Footer */
    footer {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      font-weight: 800;
      color: #94A3B8;
      /* Darker for readability */
      text-transform: uppercase;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>

  <div class="mesh-bg">
    <div class="blob1"></div>
    <div class="blob2"></div>
    <div class="blob3"></div>
  </div>

  <div class="main-wrapper">
    <div class="brand-stage animate-fade-in">
      <div class="logo-glow"></div>
      <img src="logo.png" alt="Annadaan" class="logo-main">
    </div>

    <div class="badge animate-fade-in" style="animation-delay: 0.2s;">Community Powered</div>

    <h1 class="animate-fade-in" style="animation-delay: 0.3s;">
      Every Plate<br><span>Counts</span>
    </h1>

    <p class="desc animate-fade-in" style="animation-delay: 0.4s;">
      Turn surplus food into smiles across your city.
    </p>

    <div class="action-stack">
      <a href="donor-home.html" class="card-btn animate-fade-in" style="animation-delay: 0.5s;">
        <div class="icon-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
            </path>
          </svg>
        </div>
        <div class="card-txt">
          <b>Be a Donor</b>
          <p>Donate surplus food now</p>
        </div>
        <div class="next-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>

      <a href="volunteer-login.html" class="card-btn animate-fade-in" style="animation-delay: 0.6s;">
        <div class="icon-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <div class="card-txt">
          <b>Be a Volunteer</b>
          <p>Help deliver meals</p>
        </div>
        <div class="next-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </a>
    </div>

    <footer>ANNADAAN PROTOTYPE</footer>
  </div>

</body>

</html>
