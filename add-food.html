<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Add Surplus Food</title>

<style>
  body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f7fbf9;
    margin:0;
    padding:18px;
  }
  .card{
    max-width:600px;
    margin:12px auto;
    background:#fff;
    padding:18px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
  }
  h3{margin-top:0}
  label{
    display:block;
    margin-top:14px;
    font-weight:600;
  }
  input, select{
    width:100%;
    padding:10px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #ddd;
    font-size:14px;
  }
  .row{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .type-btn{
    flex:1;
    padding:10px;
    border-radius:8px;
    border:1px solid #ddd;
    background:#f1f1f1;
    cursor:pointer;
    font-weight:600;
  }
  .active{
    background:#e8f7ec;
    border-color:#2f7a4e;
    color:#2f7a4e;
  }
  .preview{
    width:200px;
    height:140px;
    object-fit:cover;
    border-radius:8px;
    margin-top:10px;
    display:none;
    border:1px dashed #ccc;
  }
  .btn{
    margin-top:20px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#2f7a4e;
    color:#fff;
    font-size:15px;
    cursor:pointer;
  }
  .small{
    font-size:13px;
    color:#666;
    margin-top:4px;
  }
</style>
</head>

<body>

<div class="card">
  <h3>Post Surplus Food</h3>

  <!-- FOOD TYPE -->
  <label>Food Type</label>
  <div class="row">
    <button id="vegBtn" class="type-btn active">Veg</button>
    <button id="nonVegBtn" class="type-btn">Non-Veg</button>
  </div>

  <!-- VALIDITY -->
  <label>How long will the food remain good?</label>
  <select id="validHours">
    <option value="">Select duration</option>
    <option value="1">1 hour</option>
    <option value="2">2 hours</option>
    <option value="3">3 hours</option>
    <option value="4">4 hours</option>
    <option value="6">6 hours</option>
  </select>

  <!-- SERVES -->
  <label>How many people can it serve?</label>
  <input id="serves" type="number" min="1" placeholder="e.g. 20">

  <!-- LOCATION -->
  <label>Location</label>
  <div class="small">Auto-detect or enter manually</div>
  <div class="row">
    <input id="location" placeholder="Current location">
    <button id="locBtn" class="type-btn">Find</button>
  </div>

  <!-- MEDIA UPLOAD (MOVED TO LAST) -->
  <label>Upload Food Photo / Video</label>
  <input id="media" type="file" accept="image/*,video/*">
  <img id="preview" class="preview">

  <button id="postBtn" class="btn">Post Food</button>
</div>

<script>
  const donor = JSON.parse(localStorage.getItem("donor"));
  if(!donor){
    window.location.href = "login.html?next=add-food.html";
  }

  let foodType = "Veg";

  const vegBtn = document.getElementById("vegBtn");
  const nonVegBtn = document.getElementById("nonVegBtn");

  vegBtn.onclick = () => {
    foodType = "Veg";
    vegBtn.classList.add("active");
    nonVegBtn.classList.remove("active");
  };

  nonVegBtn.onclick = () => {
    foodType = "Non-Veg";
    nonVegBtn.classList.add("active");
    vegBtn.classList.remove("active");
  };

  const media = document.getElementById("media");
  const preview = document.getElementById("preview");

  media.onchange = () => {
    const file = media.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      preview.src = e.target.result;
      preview.style.display = "block";
      preview.dataset.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  document.getElementById("locBtn").onclick = () => {
    if(!navigator.geolocation){
      alert("Geolocation not supported");
      return;
    }
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude.toFixed(5);
      const lng = pos.coords.longitude.toFixed(5);
      document.getElementById("location").value = lat + ", " + lng;
    }, () => {
      alert("Location permission denied");
    });
  };

  document.getElementById("postBtn").onclick = () => {
    const validHours = document.getElementById("validHours").value;
    const serves = document.getElementById("serves").value;
    const location = document.getElementById("location").value.trim();

    if(!validHours || !serves || !location){
      alert("Please fill all details");
      return;
    }

    const foodListings = JSON.parse(localStorage.getItem("foodListings") || "[]");

    foodListings.push({
      id: "f_" + Date.now(),
      donorPhone: donor.phone,
      type: foodType,
      photo: preview.dataset.src || "",
      validHours: Number(validHours),
      serves: Number(serves),
      location,
      postedAt: Date.now(),
      status: "Posted"
    });

    localStorage.setItem("foodListings", JSON.stringify(foodListings));
    alert("Food posted successfully");
    window.location.href = "donor-home.html";
  };
</script>

</body>
</html>
