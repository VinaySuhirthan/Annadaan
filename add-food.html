<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post Surplus Food — Annadaan</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    /* Map Modal Styles */
    #map-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #map-modal.show {
      display: flex;
      opacity: 1;
    }

    .map-content {
      width: 90%;
      max-width: 500px;
      height: 500px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #map-modal.show .map-content {
      transform: scale(1);
    }

    #map {
      flex: 1;
      width: 100%;
    }

    .map-header {
      padding: 16px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .map-footer {
      padding: 16px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      gap: 12px;
    }

    /* --- Global Styles from index.css --- */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --primary: #2D6A4F;
      --primary-light: #40916C;
      --primary-dark: #1B4332;
      --secondary: #52B788;
      --accent: #B7E4C7;
      --background: #F8FAF9;
      --surface: #FFFFFF;
      --text-main: #1A1C1E;
      --text-muted: #64748B;
      --error: #EF4444;
      --success: #10B981;
      --warning: #F59E0B;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-premium: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--background);
      color: var(--text-main);
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--surface);
      box-shadow: var(--shadow-premium);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      width: 100%;
      text-decoration: none;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(45, 106, 79, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid #E2E8F0;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s ease;
      background: #F8FAFC;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--accent);
      background: white;
    }

    .animate-fade-in {
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- End Global Styles --- */

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: white;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      z-index: 10;
    }

    .form-header {
      text-align: center;
      padding: 60px 20px 30px;
      background: linear-gradient(135deg, #F0FDF4 0%, #DCFCE7 100%);
      border-radius: 0 0 40px 40px;
      margin-bottom: 24px;
    }

    .type-toggle {
      display: flex;
      background: #F1F5F9;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .type-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: inherit;
    }

    .type-btn.active {
      background: white;
      box-shadow: var(--shadow-sm);
    }

    .type-btn.veg.active {
      color: #10B981;
    }

    .type-btn.non-veg.active {
      color: #EF4444;
    }

    .image-upload-area {
      width: 100%;
      height: 180px;
      border: 2px dashed #CBD5E1;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      background: #F8FAFC;
      margin-bottom: 24px;
      transition: all 0.2s;
    }

    .image-upload-area:hover {
      border-color: var(--primary);
    }

    .image-upload-area img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }
  </style>
</head>

<body>

  <!-- Map Modal -->
  <div id="map-modal">
    <div class="map-content">
      <div class="map-header">
        <h3 style="margin:0; font-size:18px;">📌 Pin Location</h3>
        <button onclick="closeMap()"
          style="background:none; border:none; cursor:pointer; font-size:20px;">&times;</button>
      </div>
      <div style="padding: 10px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 8px;">
        <input type="text" id="map-search-input" placeholder="Search area (e.g. T. Nagar)"
          style="flex:1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"
          onkeypress="if(event.key === 'Enter') searchMapLocation()">
        <button onclick="searchMapLocation()"
          style="padding: 8px 12px; background: #2D6A4F; color: white; border: none; border-radius: 4px; cursor: pointer;">
          Search
        </button>
      </div>
      <div id="map"></div>
      <div class="map-footer">
        <div style="flex:1; font-size:12px; color:#64748b;">
          Drag marker to adjust location
        </div>
        <button onclick="confirmMapLocation()" class="btn btn-primary" style="padding: 8px 20px;">
          Confirm
        </button>
      </div>
    </div>
  </div>

  <div class="container" style="background: var(--background);">
    <div class="back-btn" onclick="location.href='donor-home.html'">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </div>

    <div class="form-header">
      <h3>Post Surplus Food</h3>
      <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Fill in the details to share your meal</p>
    </div>

    <div style="padding: 0 20px 40px;">
      <div class="card glass">
        <!-- FOOD TYPE -->
        <label>Food Type</label>
        <div class="type-toggle">
          <button id="vegBtn" class="type-btn veg active">Veg</button>
          <button id="nonVegBtn" class="type-btn non-veg">Non-Veg</button>
        </div>

        <!-- PHOTO -->
        <label>Food Photo</label>
        <div class="image-upload-area" onclick="document.getElementById('media').click()">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
            style="color: #94A3B8; margin-bottom: 8px;">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span style="font-size: 13px; color: #94A3B8; font-weight: 500;">Tap to upload photo</span>
          <img id="preview" style="display: none;">
          <button id="clearImageBtn" onclick="clearImage(event)"
            style="display: none; position: absolute; top: 10px; right: 10px; background: rgba(239, 68, 68, 0.9); color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; z-index: 10; font-size: 18px; font-weight: bold;">
            ×
          </button>
        </div>
        <input id="media" type="file" accept="image/*" style="display: none;">

        <!-- DETAILS -->
        <div class="form-group">
          <label>How many people can it serve?</label>
          <input id="serves" type="number" min="1" placeholder="e.g. 10">
        </div>

        <div class="form-group">
          <label>How long will it stay fresh?</label>
          <select id="validHours">
            <option value="">Select duration</option>
            <option value="1">1 hour</option>
            <option value="2">2 hours</option>
            <option value="4">4 hours</option>
            <option value="6">6 hours</option>
            <option value="12">12 hours</option>
          </select>
        </div>

        <div class="form-group">
          <label>Donor Type</label>
          <select id="donorType">
            <option value="">Select donor type</option>
            <option value="Restaurant">Restaurant</option>
            <option value="Hostel">Hostel</option>
            <option value="Weddings">Weddings</option>
            <option value="Others">Others</option>
          </select>
        </div>

        <div class="form-group" id="customEventGroup" style="display: none;">
          <label>Specify Event/Occasion</label>
          <input id="customEvent" placeholder="e.g. Birthday party, Corporate event">
        </div>

        <div class="form-group">
          <label>Pick-up Location</label>
          <div style="display: flex; gap: 8px;">
            <input id="address" placeholder="Address or GPS" style="flex: 1;">

            <button onclick="openMap()" class="btn btn-outline" style="width: auto; padding: 12px;" title="Pin on Map">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </button>
            <button id="locBtn" class="btn btn-outline" style="width: auto; padding: 12px;" title="Use GPS">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            </button>
          </div>
        </div>

        <button id="postBtn" class="btn btn-primary" style="margin-top: 10px;">
          Post Donation
        </button>
      </div>
    </div>
  </div>

  <script>
    const donor = JSON.parse(localStorage.getItem("donor"));
    if (!donor) window.location.href = "login.html?next=add-food.html";

    let foodType = "Veg";
    const vegBtn = document.getElementById("vegBtn");
    const nonVegBtn = document.getElementById("nonVegBtn");

    vegBtn.onclick = () => {
      foodType = "Veg";
      vegBtn.classList.add("active");
      nonVegBtn.classList.remove("active");
    };

    nonVegBtn.onclick = () => {
      foodType = "Non-Veg";
      nonVegBtn.classList.add("active");
      vegBtn.classList.remove("active");
    };

    const media = document.getElementById("media");
    const preview = document.getElementById("preview");

    media.onchange = () => {
      const file = media.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        preview.style.display = "block";
        preview.dataset.src = e.target.result;
        document.getElementById("clearImageBtn").style.display = "block";
      };
      reader.readAsDataURL(file);
    };

    // Clear image function
    function clearImage(event) {
      event.stopPropagation(); // Prevent triggering the upload area click
      const preview = document.getElementById("preview");
      const media = document.getElementById("media");
      const clearBtn = document.getElementById("clearImageBtn");

      preview.src = "";
      preview.style.display = "none";
      preview.dataset.src = "";
      media.value = "";
      clearBtn.style.display = "none";
    }

    // Handle donor type change
    document.getElementById("donorType").onchange = (e) => {
      const customEventGroup = document.getElementById("customEventGroup");
      if (e.target.value === "Others") {
        customEventGroup.style.display = "block";
      } else {
        customEventGroup.style.display = "none";
        document.getElementById("customEvent").value = "";
      }
    };

    document.getElementById("locBtn").onclick = () => {
      const locBtn = document.getElementById("locBtn");

      if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
      }

      const originalContent = locBtn.innerHTML;
      locBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; // Spinner icon if available, or just visual feedback
      document.getElementById("address").value = "Detecting location...";

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        // Update globals even if we don't save them to DB, just in case
        window.currentLat = lat.toFixed(5);
        window.currentLng = lng.toFixed(5);

        try {
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
          const data = await response.json();

          if (data && data.display_name) {
            // Formatting consistent with view-food.html
            const addr = data.address;
            const parts = [
              addr.road || addr.pedestrian,
              addr.suburb || addr.neighbourhood,
              addr.city || addr.town || addr.village
            ].filter(Boolean);

            const finalAddress = parts.length > 0 ? parts.join(', ') : data.display_name.split(',').slice(0, 3).join(',');
            document.getElementById("address").value = finalAddress;
          } else {
            document.getElementById("address").value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          }
        } catch (e) {
          console.error("Geocoding failed", e);
          document.getElementById("address").value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        } finally {
          locBtn.innerHTML = originalContent;
        }

      }, (err) => {
        console.error(err);
        alert("Location permission denied or unavailable");
        locBtn.innerHTML = originalContent;
        document.getElementById("address").value = "";
      });
    };

    // Map handling
    let map, marker;

    function openMap() {
      const modal = document.getElementById('map-modal');
      modal.classList.add('show');

      if (!map) {
        initMap();
      } else {
        setTimeout(() => map.invalidateSize(), 100);
      }
    }

    function closeMap() {
      document.getElementById('map-modal').classList.remove('show');
    }

    function initMap() {
      // Default to Bangalore or current lat/lng if set
      const defaultLat = window.currentLat || 12.9716;
      const defaultLng = window.currentLng || 77.5946;

      map = L.map('map').setView([defaultLat, defaultLng], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      marker = L.marker([defaultLat, defaultLng], {
        draggable: true
      }).addTo(map);

      map.on('click', function (e) {
        marker.setLatLng(e.latlng);
      });
    }

    async function searchMapLocation() {
      const query = document.getElementById('map-search-input').value;
      if (!query) return;

      const btn = document.querySelector('button[onclick="searchMapLocation()"]');
      const originalText = btn.innerHTML;
      btn.innerHTML = '...';
      btn.disabled = true;

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (data && data.length > 0) {
          const result = data[0];
          const lat = parseFloat(result.lat);
          const lon = parseFloat(result.lon);

          map.setView([lat, lon], 13);
          marker.setLatLng([lat, lon]);
        } else {
          alert('Location not found');
        }
      } catch (error) {
        console.error('Search error:', error);
        alert('Error searching location');
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function confirmMapLocation() {
      const latLng = marker.getLatLng();
      closeMap();

      // Update global variables for DB save
      window.currentLat = latLng.lat.toFixed(5);
      window.currentLng = latLng.lng.toFixed(5);

      const addrInput = document.getElementById("address");
      addrInput.value = "Fetching address...";

      // Reverse geocode for clean address
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latLng.lat}&lon=${latLng.lng}&zoom=18&addressdetails=1`);
        const data = await response.json();
        if (data && data.display_name) {
          // Shorten address
          const addr = data.address;
          const parts = [
            addr.road || addr.pedestrian,
            addr.suburb || addr.neighbourhood,
            addr.city || addr.town || addr.village
          ].filter(Boolean);
          addrInput.value = parts.length > 0 ? parts.join(', ') : data.display_name.split(',').slice(0, 3).join(',');
        } else {
          addrInput.value = `${window.currentLat}, ${window.currentLng}`;
        }
      } catch (e) {
        addrInput.value = `${window.currentLat}, ${window.currentLng}`;
      }
    }

    document.getElementById("postBtn").onclick = async () => {
      const postBtn = document.getElementById("postBtn");
      const foodType = document.querySelector(".type-toggle .active").textContent;
      const serves = document.getElementById("serves").value;
      const donorType = document.getElementById("donorType").value;
      const customEvent = document.getElementById("customEvent").value;
      const address = document.getElementById("address").value;

      if (!serves || !address || !donorType) return alert("Please fill all details");
      if (donorType === "Others" && !customEvent) return alert("Please specify the event/occasion");

      postBtn.disabled = true;
      postBtn.textContent = "Posting...";

      let photoUrl = null;
      const file = media.files[0];

      if (file) {
        try {
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}-${Math.random().toString(36).substring(2)}.${fileExt}`;
          const filePath = `${fileName}`;

          const { error: uploadError } = await window.sb.storage
            .from('food_images')
            .upload(filePath, file);

          if (uploadError) throw uploadError;

          const { data: { publicUrl } } = window.sb.storage
            .from('food_images')
            .getPublicUrl(filePath);

          photoUrl = publicUrl;
        } catch (error) {
          console.error("Error uploading image:", error);
          alert("Error uploading image. Please try again.");
          postBtn.disabled = false;
          postBtn.textContent = "Post Donation";
          return;
        }
      }

      const newFood = {
        id: crypto.randomUUID(),
        donor_phone: donor.phone,
        donor_type: donorType,
        event_name: donorType === "Others" ? customEvent : null,
        food_type: foodType,
        serves: parseInt(serves),
        valid_hours: parseInt(document.getElementById("validHours").value) || null,
        address: address,
        photo_url: photoUrl,
        status: "available"
      };

      const { error } = await window.sb.from('food_table').insert([newFood]);

      if (error) {
        console.error(error);
        alert("Error saving to database");
        postBtn.disabled = false;
        postBtn.textContent = "Post Donation";
        return;
      }

      alert("Food posted successfully!");
      location.href = "donor-home.html";
    };
  </script>

</body>

</html>
