<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annadaan — Volunteer & NGO Portal</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-client.js"></script>
    <script src="../fluid-background.js" defer></script>
    <style>
        .btn-google {
            background: #FFFFFF;
            color: #374151;
            border: 1.5px solid #E5E7EB;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            margin-bottom: 20px;
            transition: all 0.2s;
            border: 1.5px solid #D1D5DB;
            color: #1F2937;
        }
        .btn-google:hover {
            background: #F9FAFB;
            border-color: #9CA3AF;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-1px);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 14px 0 18px;
            color: var(--gray);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E2E8F0;
        }
        .divider span { padding: 0 10px; }
        .sub-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
            cursor: pointer;
        }
        .sub-link:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <div class="container" style="max-width: 440px; margin: 30px auto;">
        <img src="../images/annadaan-logo-transparent.png" alt="Annadaan Logo" class="brand-auth-logo">
        <header class="header" style="padding: 10px 0 20px; text-align: center;">
            <h1 style="font-size: 1.45rem; color: #1B4332;">Volunteer & NGO Access</h1>
            <p style="color: #64748b; font-size: 14px;">Connecting surplus food with those in need</p>
        </header>

        <div class="card form-container">
            <!-- Google Login -->
            <button class="btn-google" id="btnGoogleAuthVol" onclick="signInWithGoogleRole()">
                <svg width="22" height="22" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                </svg>
                Sign in with Google
            </button>

            <div class="divider"><span>or with ID / Phone</span></div>

            <div class="tabs">
                <button class="tab-btn active" id="login-tab">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <button class="tab-btn" id="register-tab">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="active-form">
                <div class="form-group">
                    <label for="login-phone"><i class="fas fa-user"></i> Email Address or Phone Number</label>
                    <input type="text" id="login-phone" placeholder="Enter phone (e.g. 9876543210) or email" required>
                </div>

                <div class="form-group" id="pwdGroupVol" style="display: none;">
                    <label for="login-pwd"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="login-pwd" placeholder="Enter password">
                </div>

                <div class="form-group">
                    <label for="user-type"><i class="fas fa-users"></i> I am a</label>
                    <select id="user-type" required>
                        <option value="volunteer">Volunteer (Delivery)</option>
                        <option value="ngo">NGO (Community Kitchen)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                </button>

                <center>
                    <a class="sub-link" onclick="togglePwdField()">Switch to Email & Password login</a>
                </center>
            </form>

            <!-- Registration Form -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label for="register-type"><i class="fas fa-user-tag"></i> Register as</label>
                    <select id="register-type" required>
                        <option value="volunteer">Volunteer</option>
                        <option value="ngo">NGO</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reg-email"><i class="fas fa-envelope"></i> Email (optional)</label>
                    <input type="email" id="reg-email" placeholder="contact@domain.com">
                </div>

                <div class="form-group">
                    <label for="reg-password"><i class="fas fa-lock"></i> Password (optional)</label>
                    <input type="password" id="reg-password" placeholder="At least 6 characters">
                </div>

                <!-- Volunteer Fields -->
                <div id="volunteer-fields" style="display: block;">
                    <div class="form-group">
                        <label for="vol-name"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="vol-name" placeholder="Your full name">
                    </div>

                    <div class="form-group">
                        <label for="vol-address"><i class="fas fa-map-marker-alt"></i> Address</label>
                        <textarea id="vol-address" placeholder="Complete address" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="vol-phone"><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="tel" id="vol-phone" placeholder="10-digit phone number">
                    </div>

                    <div class="form-group">
                        <label for="vol-location"><i class="fas fa-location-dot"></i> Location (City/Area)</label>
                        <input type="text" id="vol-location" placeholder="Your location for distance calculation">
                    </div>
                </div>

                <!-- NGO Fields -->
                <div id="ngo-fields" style="display: none;">
                    <div class="form-group">
                        <label for="ngo-name"><i class="fas fa-building"></i> Organization Name</label>
                        <input type="text" id="ngo-name" placeholder="Organization name">
                    </div>

                    <div class="form-group">
                        <label for="ngo-id"><i class="fas fa-id-card"></i> Organization ID</label>
                        <input type="text" id="ngo-id" placeholder="Official registration ID">
                    </div>

                    <div class="form-group">
                        <label for="ngo-head"><i class="fas fa-user-tie"></i> Organization Head</label>
                        <input type="text" id="ngo-head" placeholder="Head person's name">
                    </div>

                    <div class="form-group">
                        <label for="ngo-address"><i class="fas fa-map-marker-alt"></i> Organization Address</label>
                        <textarea id="ngo-address" placeholder="Complete organization address" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="ngo-phone"><i class="fas fa-phone"></i> Contact Number</label>
                        <input type="tel" id="ngo-phone" placeholder="10-digit phone number">
                    </div>

                    <div class="form-group">
                        <label for="ngo-location"><i class="fas fa-location-dot"></i> Organization Location</label>
                        <input type="text" id="ngo-location" placeholder="Organization location">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="alert alert-info mt-30">
                <i class="fas fa-info-circle"></i>
                <strong>Note:</strong> NGOs can request surplus food. Volunteers can view listings and deliver meals.
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        let volEmailMode = false;
        function togglePwdField() {
            volEmailMode = !volEmailMode;
            document.getElementById('pwdGroupVol').style.display = volEmailMode ? 'block' : 'none';
        }

        async function signInWithGoogleRole() {
            if (!window.sb || !window.sb.auth) {
                return showAlert('Database connection not available.', 'error');
            }

            const role = document.getElementById('user-type').value || 'volunteer';
            localStorage.setItem('pending_auth_role', role);

            try {
                const { error } = await window.sb.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + window.location.pathname
                    }
                });
                if (error) {
                    if (error.message.includes('provider is not enabled')) {
                        showAlert('Google Provider is not enabled in Supabase yet.<br>Please enable it in Supabase Dashboard (Auth -> Providers -> Google) or use ID/Phone login!', 'error');
                    } else {
                        showAlert('Google Sign-In: ' + error.message, 'error');
                    }
                }
            } catch (err) {
                showAlert('Google Sign-In error: ' + err.message, 'error');
            }
        }
    </script>
</body>

</html>
