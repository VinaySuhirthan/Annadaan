<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Feedback - Annadaan</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../fluid-background.js" defer></script>
    <style>
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        .form-group input,
        .form-group textarea {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #E6E9EE;
            width: 100%;
            font-size: 14px;
            font-family: inherit;
        }

        .location-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        @media (min-width: 480px) {
            .location-controls {
                flex-direction: row;
            }
        }

        #locationStatus {
            padding: 12px;
            border: 1px solid #E6E9EE;
            border-radius: 8px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--gray);
            background: #f8fafc;
        }

        .button-container {
            margin-top: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 480px) {
            .button-container {
                flex-direction: row;
                justify-content: flex-end;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Navigation Bar -->
        <div class="nav-bar">
            <div>
                <a href="volunteer-dashboard.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Dashboard
                </a>
            </div>
            <div class="user-info">
                <i class="fas fa-comment-dots"></i>
                <span>Delivery Feedback</span>
            </div>
        </div>

        <header class="header">
            <h1 style="font-weight: 700; letter-spacing: -0.01em;"><i class="fas fa-comment-medical"></i> Delivery
                Feedback</h1>
            <p style="font-weight: 400;">Share your experience and track food distribution impact</p>
        </header>

        <!-- Delivery Summary -->
        <div class="card" id="delivery-summary">
            <div class="spinner"></div>
        </div>

        <!-- Feedback Form -->
        <div class="card">
            <h2 style="margin-bottom: 20px; color: var(--dark);">
                <i class="fas fa-chart-line"></i> Impact Tracking
            </h2>

            <form id="feedback-form">
                <p style="color:var(--gray); margin-bottom:20px;">Please provide the three required details below.</p>

                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> Delivery Location *</label>
                    <div class="location-controls">
                        <button type="button" id="captureLocationBtn" class="btn btn-primary">
                            <i class="fas fa-crosshairs"></i> Use Current Location
                        </button>
                        <div id="locationStatus">Not captured</div>
                    </div>
                    <input type="hidden" id="feedback-lat">
                    <input type="hidden" id="feedback-lng">
                </div>

                <div class="form-group">
                    <label for="people-served"><i class="fas fa-users"></i> Number of people served *</label>
                    <input type="number" id="people-served" min="1" required placeholder="e.g., 50">
                </div>

                <div class="form-group">
                    <label for="notes"><i class="fas fa-sticky-note"></i> Notes (optional)</label>
                    <textarea id="notes" rows="4" placeholder="Any brief notes about the delivery experience..."></textarea>
                </div>

                <div class="button-container">
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-paper-plane"></i> Submit Feedback
                    </button>
                    <button type="button" id="cancelFeedback" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../script.js"></script>
    <script>
        let currentRequest = null;

        document.addEventListener('DOMContentLoaded', function () {
            const user = checkAuth();
            if (!user || (user.type !== 'ngo' && user.type !== 'volunteer')) {
                window.location.href = 'ngo-volunteer-auth.html';
                return;
            }

            loadDeliveryData();
            setupFeedbackForm();
        });

        function loadDeliveryData() {
            currentRequest = JSON.parse(localStorage.getItem('currentRequest'));
            const container = document.getElementById('delivery-summary');

            if (!currentRequest) {
                container.innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        No delivery data found. Please select a completed request.
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <h3 style="color: var(--dark); margin-bottom: 15px;">
                    <i class="fas fa-truck"></i> Delivery Summary
                </h3>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
                    <div>
                        <label style="color: var(--gray); font-size: 0.9rem;">Restaurant</label>
                        <p style="color: var(--dark); font-weight: 500;">${currentRequest.restaurant}</p>
                    </div>
                    <div>
                        <label style="color: var(--gray); font-size: 0.9rem;">Food Collected</label>
                        <p style="color: var(--dark); font-weight: 500;">${currentRequest.foodType}</p>
                    </div>
                    <div>
                        <label style="color: var(--gray); font-size: 0.9rem;">Quantity</label>
                        <p style="color: var(--dark); font-weight: 500;">${currentRequest.quantity}</p>
                    </div>
                    <div>
                        <label style="color: var(--gray); font-size: 0.9rem;">Pickup Date</label>
                        <p style="color: var(--dark); font-weight: 500;">${currentRequest.pickupFormatted || 'Not scheduled'}</p>
                    </div>
                </div>
                
                ${currentRequest.emergency ? `
                    <div style="background: #FEF3C7; padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                        <p style="color: #92400E; margin: 0;">
                            <i class="fas fa-exclamation-triangle"></i>
                            <strong>Emergency Distribution:</strong> ${currentRequest.emergencyReason}
                        </p>
                    </div>
                ` : ''}
                
                <div style="background: var(--primary-light); padding: 12px; border-radius: 8px;">
                    <p style="color: var(--primary-dark); margin: 0;">
                        <i class="fas fa-info-circle"></i>
                        Please provide feedback about this food distribution to help improve the system.
                    </p>
                </div>
            `;

            // Set default delivery time to now (if field exists)
            try {
                const now = new Date();
                const localDateTime = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                const deliveryTimeEl = document.getElementById('delivery-time');
                if (deliveryTimeEl) deliveryTimeEl.value = localDateTime;
            } catch (e) { console.warn('No delivery-time field to populate', e); }

            // Auto-populate food type (if field exists)
            try {
                const foodTypeEl = document.getElementById('food-type-distributed');
                if (foodTypeEl) foodTypeEl.value = currentRequest.foodType;
            } catch (e) { console.warn('No food-type-distributed field to populate', e); }
        }

        function setupFeedbackForm() {
            const form = document.getElementById('feedback-form');
            const captureBtn = document.getElementById('captureLocationBtn');
            const locationStatus = document.getElementById('locationStatus');
            const latInput = document.getElementById('feedback-lat');
            const lngInput = document.getElementById('feedback-lng');
            const cancelBtn = document.getElementById('cancelFeedback');

            // Capture current geolocation (user must allow)
            captureBtn && captureBtn.addEventListener('click', () => {
                if (!navigator.geolocation) return showAlert('Geolocation not supported', 'error');
                captureBtn.disabled = true;
                locationStatus.textContent = 'Locating...';
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lng = pos.coords.longitude.toFixed(6);
                    latInput.value = lat;
                    lngInput.value = lng;
                    locationStatus.textContent = `Lat:${lat}, Lng:${lng}`;
                    captureBtn.disabled = false;
                }, (err) => {
                    console.error('Geolocation error', err);
                    showAlert('Unable to get location: ' + err.message, 'error');
                    locationStatus.textContent = 'Not captured';
                    captureBtn.disabled = false;
                }, { enableHighAccuracy: true, timeout: 10000 });
            });

            cancelBtn && cancelBtn.addEventListener('click', () => {
                if (confirm('Discard feedback and go back?')) window.location.href = 'my-requests.html';
            });

            form && form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const peopleServed = parseInt(document.getElementById('people-served').value);
                const notes = document.getElementById('notes').value.trim() || null;
                const lat = parseFloat(latInput.value) || null;
                const lng = parseFloat(lngInput.value) || null;

                if (!peopleServed || peopleServed <= 0) {
                    showAlert('Please enter number of people served', 'error');
                    return;
                }

                // Determine food/request id
                let foodId = null;
                if (currentRequest && currentRequest.id) foodId = currentRequest.id;
                else {
                    const params = new URLSearchParams(window.location.search);
                    foodId = params.get('id');
                }

                if (!foodId) {
                    showAlert('No associated donation found. Please open feedback from the request page.', 'error');
                    return;
                }

                // Prepare updates
                const updates = { people_served: peopleServed, delivery_feedback: notes, delivered_at: new Date().toISOString(), delivered_by: (JSON.parse(localStorage.getItem('currentUser')) || {}).phone || null };
                if (lat) updates.delivery_lat = lat;
                if (lng) updates.delivery_lng = lng;

                try {
                    // If Supabase client not configured, save locally instead of throwing
                    if (!window.sb || typeof window.sb.from !== 'function') {
                        let allFeedback = JSON.parse(localStorage.getItem('foodbridge_feedback')) || [];
                        allFeedback.push({ foodId, peopleServed, notes, lat, lng, submittedAt: new Date().toISOString() });
                        localStorage.setItem('foodbridge_feedback', JSON.stringify(allFeedback));
                        showAlert('Feedback saved locally (offline).', 'success');
                        setTimeout(() => window.location.href = 'my-requests.html', 900);
                        return;
                    }

                    const { error } = await window.sb.from('food_table').update(updates).eq('id', foodId);
                    if (error) throw error;

                    showAlert('Feedback saved. Thank you!', 'success');
                    setTimeout(() => window.location.href = 'my-requests.html', 900);
                } catch (err) {
                    console.error('Save feedback error', err);
                    // Fallback to localStorage (non-destructive) if server save fails
                    try {
                        let allFeedback = JSON.parse(localStorage.getItem('foodbridge_feedback')) || [];
                        allFeedback.push({ foodId, peopleServed, notes, lat, lng, submittedAt: new Date().toISOString() });
                        localStorage.setItem('foodbridge_feedback', JSON.stringify(allFeedback));
                        showAlert('Feedback saved locally (offline).', 'success');
                        setTimeout(() => window.location.href = 'my-requests.html', 900);
                    } catch (e2) {
                        console.error('Local save failed', e2);
                        showAlert('Unable to save feedback. Please try again later.', 'error');
                    }
                }
            });
        }
    </script>
</body>

</html>
