<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>My Volunteering — Annadaan</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>

    <style>
        .page-header {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 14px;
            border: 1px solid var(--border);
            color: var(--dark);
            text-decoration: none;
            transition: var(--transition);
        }

        .back-btn:hover {
            transform: translateX(-5px);
            background: var(--light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .tabs {
            margin-bottom: 24px;
            display: flex;
            background: #F1F5F9;
            padding: 4px;
            border-radius: 14px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--gray);
            border: none;
            background: none;
        }

        .tab.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow);
        }

        .delivery-card {
            background: white;
            border-radius: var(--radius);
            padding: 0;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: var(--transition);
        }

        .delivery-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
        }

        .delivery-banner {
            padding: 16px 24px;
            background: #F8FAFC;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .delivery-body {
            padding: 24px;
        }

        .status-badge {
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .detail-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .detail-row i {
            width: 24px;
            color: var(--primary);
            font-size: 1.2rem;
            margin-top: 4px;
        }

        .detail-content h4 {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-content p {
            font-size: 16px;
            font-weight: 500;
            color: var(--dark);
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        .empty-state {
            padding: 60px 24px;
            text-align: center;
            background: white;
            border-radius: var(--radius);
            border: 2px dashed var(--border);
        }

        .pulse-btn {
            animation: pulse-soft 2s infinite;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="page-header animate-fade-in">
            <a href="volunteer-dashboard.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h2 style="font-weight: 700; letter-spacing: -0.01em;">My Volunteering</h2>
            <div style="width: 44px;"></div>
        </div>

        <div class="tabs animate-fade-in" style="animation-delay: 0.1s;">
            <button class="tab active" onclick="switchTab('active')">Current Tasks</button>
            <button class="tab" onclick="switchTab('history')">Delivery History</button>
        </div>

        <div id="content-area" class="animate-fade-in" style="animation-delay: 0.2s;">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let currentTab = 'active';
        let allDeliveries = [];
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', function () {
            currentUser = getCurrentUser();
            if (!currentUser || currentUser.type !== 'volunteer') {
                window.location.href = 'index.html';
                return;
            }

            loadDeliveries();
        });

        async function loadDeliveries() {
            const container = document.getElementById('content-area');

            if (!window.sb) {
                container.innerHTML = '<div class="empty-state"><h3>Database connection error</h3></div>';
                return;
            }

            try {
                const { data, error } = await window.sb.from('food_table')
                    .select('*')
                    .eq('volunteer_phone', currentUser.phone);

                if (error) throw error;

                allDeliveries = data || [];
                renderDeliveries();

            } catch (err) {
                console.error('Error loading deliveries:', err);
                container.innerHTML = `<div class="empty-state"><h3>Error: ${err.message}</h3></div>`;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderDeliveries();
        }

        function renderDeliveries() {
            const container = document.getElementById('content-area');

            const filtered = allDeliveries.filter(d => {
                if (currentTab === 'active') {
                    return d.status !== 'Delivered';
                } else {
                    return d.status === 'Delivered';
                }
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open" style="font-size: 3rem; color: #E2E8F0; margin-bottom: 16px;"></i>
                        <h3>No ${currentTab} deliveries</h3>
                        <p style="color: var(--gray); margin-top: 8px;">${currentTab === 'active' ? 'You don\'t have any pending tasks right now.' : 'Your completed deliveries will appear here.'}</p>
                        ${currentTab === 'active' ? '<a href="view-food.html" class="btn btn-primary" style="margin-top: 24px;">Find Food to Deliver</a>' : ''}
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(d => `
                <div class="delivery-card animate-fade-in">
                    <div class="delivery-banner">
                        <span class="status-badge status-${getStatusClass(d.status)}">${d.status}</span>
                        <span style="font-size: 12px; color: var(--gray); font-weight: 600;">${new Date(d.accepted_at || d.created_at).toLocaleDateString()}</span>
                    </div>
                    <div class="delivery-body">
                        <div class="detail-row">
                            <i class="fas fa-utensils"></i>
                            <div class="detail-content">
                                <h4>Food Type</h4>
                                <p>${d.food_type} (Serves ${d.serves})</p>
                            </div>
                        </div>
                        <div class="detail-row">
                            <i class="fas fa-map-marker-alt"></i>
                            <div class="detail-content">
                                <h4>Pick up Address</h4>
                                <p>${d.address}</p>
                            </div>
                        </div>
                        <div class="detail-row">
                            <i class="fas fa-phone"></i>
                            <div class="detail-content">
                                <h4>Donor Contact</h4>
                                <p>${d.donor_phone}</p>
                            </div>
                        </div>

                        ${currentTab === 'active' ? `
                            <div class="action-btns">
                                <a href="food-status.html?id=${d.id}" class="btn btn-primary" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-chart-line"></i> Track Status
                                </a>
                                <a href="tel:${d.donor_phone}" class="btn btn-secondary">
                                    <i class="fas fa-phone-alt"></i> Call Donor
                                </a>
                            </div>
                        ` : `
                            <div class="action-btns">
                                <a href="food-status.html?id=${d.id}" class="btn btn-secondary" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-history"></i> View Journey
                                </a>
                            </div>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function getStatusClass(status) {
            if (status === 'Volunteer Assigned') return 'accepted';
            if (status === 'Picked Up') return 'picked';
            if (status === 'Delivered') return 'completed';
            return 'pending';
        }

        async function updateStatus(id, newStatus) {
            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            btn.disabled = true;

            try {
                const { error } = await window.sb.from('food_table')
                    .update({ status: newStatus })
                    .eq('id', id);

                if (error) throw error;

                alert(`Status updated to: ${newStatus}`);
                loadDeliveries();

            } catch (err) {
                console.error('Error updating status:', err);
                alert('Error: ' + err.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
