<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Dashboard — Annadaan</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-client.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(124, 58, 237, 0.10), transparent 24%),
        linear-gradient(180deg, #f8fbff 0%, #f8fafc 100%);
      overflow-x: hidden;
      color: var(--dark);
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 20px 0 60px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(18px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      padding: 24px;
      overflow-y: auto;
      border-right: 1px solid rgba(37, 99, 235, 0.12);
      border-top: 1px solid rgba(255, 255, 255, 0.7);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }

    .sidebar.open {
      transform: translateX(280px);
    }

    .tabs-container {
      padding: 6px;
      background: rgba(255, 255, 255, 0.66);
      border-radius: 18px;
      display: flex;
      margin: 18px 20px;
      width: calc(100% - 40px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(16px);
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-weight: 700;
      font-size: 13px;
      border-radius: 14px;
      cursor: pointer;
      transition: var(--transition);
      color: var(--gray);
    }

    .tab.active {
      background: var(--grad-primary);
      color: white;
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.22);
    }

    .food-card {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding: 18px;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 22px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    .food-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(37, 99, 235, 0.18);
    }

    .food-img-wrapper {
      width: 80px;
      height: 80px;
      min-width: 80px;
      border-radius: 18px;
      background: var(--surface-alt);
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    }

    .food-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .food-info {
      flex: 1;
      min-width: 0;
    }

    .status-pill {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 8px;
      letter-spacing: 0.08em;
    }

    .status-accepted {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-picked {
      background: #fef3c7;
      color: #92400e;
    }

    .status-completed {
      background: #d1fae5;
      color: #065f46;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 64px;
      height: 64px;
      background: var(--grad-primary);
      color: white;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 36px rgba(37, 99, 235, 0.28);
      cursor: pointer;
      z-index: 90;
      border: none;
      transition: var(--transition);
    }

    .fab:hover {
      transform: translateY(-3px);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      display: none;
      z-index: 999;
    }

    .overlay.show {
      display: block;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0;
      background: rgba(255, 255, 255, 0.74);
      min-height: 100vh;
      position: relative;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(18px);
    }

    .content-wrapper {
      padding: 0 20px 80px;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--grad-primary);
      color: white;
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: var(--dark-soft);
      border: 1px solid var(--border);
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .ngo-contact-box {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(124, 58, 237, 0.08));
      padding: 12px;
      border-radius: 12px;
      margin-top: 8px;
      border: 1px solid rgba(37, 99, 235, 0.14);
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      color: var(--gray-light);
      padding: 60px 20px;
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .nav-item {
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 14px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
    }

    .nav-item:hover {
      background: rgba(37, 99, 235, 0.08);
      color: var(--primary);
      border-color: rgba(37, 99, 235, 0.14);
    }

    .logout {
      color: #ef4444 !important;
      border-color: rgba(239, 68, 68, 0.18);
      background: rgba(254, 242, 242, 0.72);
      box-shadow: 0 8px 18px rgba(239, 68, 68, 0.06);
    }

    .logout:hover {
      background: rgba(254, 226, 226, 0.9);
      border-color: rgba(239, 68, 68, 0.26);
      color: #dc2626 !important;
    }

    .sidebar-header {
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
    }
  </style>
</head>

<body>
  <script>
    let donor = JSON.parse(localStorage.getItem("donor"));
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if (!donor && currentUser && currentUser.type === "donor") {
      donor = currentUser;
      localStorage.setItem("donor", JSON.stringify(donor));
    }

    if (!donor) location.href = "login.html";
  </script>

  <div class="container">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header" style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <div
          style="width: 48px; height: 48px; background: #f0fdf4; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #10b981;">
          <i class="fas fa-user"></i>
        </div>
        <div>
          <span style="font-weight: 700; display: block;" id="sideName"></span>
          <span style="font-size: 12px; color: #64748b;" id="sidePhone"></span>
        </div>
      </div>
      <div class="nav-item" onclick="showDashboard()"><i class="fas fa-home"></i> Home</div>
      <div class="nav-item" onclick="showProfile()"><i class="fas fa-user-circle"></i> Profile</div>
      <div class="nav-item logout" onclick="donorLogout()" style="margin-top: 40px;"><i class="fas fa-sign-out-alt"></i>
        Logout</div>
    </div>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- HEADER -->
    <div class="app-header">
      <div onclick="openMenu()" style="cursor: pointer; color: #1e293b;"><i class="fas fa-bars fa-lg"></i></div>
      <div style="font-weight: 700; font-size: 18px; letter-spacing: -0.01em;" id="pageTitle">Annadaan</div>
      <div style="width: 24px;"></div>
    </div>

    <!-- TABS -->
    <div class="tabs-container" id="homeTabs">
      <div class="tab active" id="tabActive" onclick="switchTab('active')">Active</div>
      <div class="tab" id="tabHistory" onclick="switchTab('history')">History</div>
    </div>

    <!-- MAIN VIEWS -->
    <div id="activeView" class="content-wrapper">
      <div id="listingsActive"></div>
    </div>

    <div id="historyView" class="content-wrapper" style="display:none;">
      <div id="listingsHistory"></div>
    </div>

    <!-- PROFILE VIEW -->
    <div id="profileView" class="content-wrapper" style="display:none;">
      <div class="card">
        <h4 style="margin-bottom: 20px; font-weight: 700;">Profile Settings</h4>
        <p style="margin-bottom: 12px;"><strong>Name:</strong> <span id="pName"></span></p>
        <p style="margin-bottom: 20px;"><strong>Phone:</strong> <span id="pPhone"></span></p>
        <button class="btn btn-secondary" style="width: 100%;" onclick="showDashboard()">Back to Dashboard</button>
      </div>
    </div>

    <div class="fab" id="fab" onclick="location.href='add-food.html'">
      <i class="fas fa-plus fa-lg"></i>
    </div>
  </div>

  <script>
    let currentTab = 'active';
    let allDonations = [];
    let donorFoodChannel = null;

    sideName.textContent = donor.name;
    sidePhone.textContent = donor.phone;

    function openMenu() { sidebar.classList.add("open"); overlay.classList.add("show") }
    function closeMenu() { sidebar.classList.remove("open"); overlay.classList.remove("show") }
    function donorLogout() {
      localStorage.removeItem("donor");
      localStorage.removeItem("currentUser");
      sessionStorage.removeItem("temp_donor");
      location.href = "../index.html";
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const tabActiveEl = document.getElementById('tabActive');
      const tabHistoryEl = document.getElementById('tabHistory');

      if (tabActiveEl) tabActiveEl.classList.remove('active');
      if (tabHistoryEl) tabHistoryEl.classList.remove('active');

      if (tab === 'active' && tabActiveEl) tabActiveEl.classList.add('active');
      if (tab === 'history' && tabHistoryEl) tabHistoryEl.classList.add('active');

      const activeViewEl = document.getElementById('activeView');
      const historyViewEl = document.getElementById('historyView');

      if (activeViewEl) activeViewEl.style.display = tab === 'active' ? 'block' : 'none';
      if (historyViewEl) historyViewEl.style.display = tab === 'history' ? 'block' : 'none';

      renderDonations();
    }

    function showProfile() {
      closeMenu();
      pageTitle.textContent = "Your Profile";
      homeTabs.style.display = "none";
      activeView.style.display = "none";
      historyView.style.display = "none";
      profileView.style.display = "block";
      fab.style.display = "none";
      pName.textContent = donor.name;
      pPhone.textContent = donor.phone;
    }

    function showDashboard() {
      closeMenu();
      pageTitle.textContent = "Annadaan";
      homeTabs.style.display = "flex";
      profileView.style.display = "none";
      switchTab(currentTab);
      fab.style.display = "flex";
    }

    async function loadDonations() {
      const { data, error } = await window.sb.from('food_table')
        .select('*')
        .eq('donor_phone', donor.phone)
        .order('created_at', { ascending: false });

      if (error) return console.error(error);
      allDonations = data || [];
      renderDonations();
    }

    function renderDonations() {
      const activeContainer = document.getElementById("listingsActive");
      const historyContainer = document.getElementById("listingsHistory");

      const activeItems = allDonations.filter(d => d.status !== 'Delivered');
      const historyItems = allDonations.filter(d => d.status === 'Delivered');

      activeContainer.innerHTML = activeItems.length ? activeItems.map(d => renderCard(d)).join('') : '<div class="empty-state"><i class="fas fa-box-open"></i><p>No active donations</p></div>';
      historyContainer.innerHTML = historyItems.length ? historyItems.map(d => renderCard(d)).join('') : '<div class="empty-state"><i class="fas fa-history"></i><p>No donation history</p></div>';
    }

    function renderCard(f) {
      const statusClass = f.status === 'Picked Up' ? 'picked' : f.status === 'Delivered' ? 'completed' : 'accepted';

      const isAccepted = f.status === 'Accepted';
      const isRequested = f.status === 'NGO Requested';

      return `
        <div class="food-card" onclick="location.href='../food-status.html?id=${f.id}'">
          <div class="food-img-wrapper">
            <img src="${f.photo_url || 'https://images.unsplash.com/photo-1488459711612-97435f0f0980?auto=format&fit=crop&q=80&w=200'}">
          </div>
          <div class="food-info">
            <div style="font-weight: 600; font-size: 15px; margin-bottom: 4px;">${f.food_type}</div>
            <div style="font-size: 12px; color: #64748b; font-weight: 600;">Serves ${f.serves} • ${new Date(f.created_at).toLocaleDateString()}</div>
            <div class="status-pill status-${statusClass}">${f.status}</div>
            
            ${isRequested ? `
              <div class="ngo-contact-box">
                <div style="font-size: 12px; font-weight: 600; color: #065f46; margin-bottom: 4px;"><i class="fas fa-hands-helping"></i> NGO Contact</div>
                <div style="font-size: 14px; font-weight: 600; color: #1e293b;">${f.ngo_phone || 'NGO'}</div>
              </div>
              <div class="action-buttons">
                <button class="btn btn-primary" onclick="event.stopPropagation(); acceptRequest('${f.id}')">
                  <i class="fas fa-check"></i> Accept
                </button>
                <button class="btn btn-secondary" onclick="event.stopPropagation(); rejectRequest('${f.id}')" style="color: #ef4444; border-color: #ef4444;">
                  <i class="fas fa-times"></i> Reject
                </button>
              </div>
            ` : isAccepted ? `
              <button class="btn btn-primary" onclick="event.stopPropagation(); confirmPickup('${f.id}')" style="margin-top: 12px; width: 100%; padding: 8px; font-size: 13px;">
                <i class="fas fa-truck-pickup"></i> Confirm Pickup
              </button>
            ` : ''}
          </div>
          ${!isAccepted && !isRequested ? '<i class="fas fa-chevron-right" style="color: #E2E8F0;"></i>' : ''}
        </div>`;
    }

    async function confirmPickup(foodId) {
      if (!confirm('Has the NGO picked up this food?')) return;

      const { error } = await window.sb.from('food_table')
        .update({ status: 'Picked Up' })
        .eq('id', foodId);

      if (error) {
        console.error(error);
        showAlert('Error updating status', 'error');
        return;
      }

      showAlert('✅ Pickup Confirmed! Status updated to Picked Up.', 'success');
      loadDonations();
    }

    function subscribeToDonationUpdates() {
      if (!window.sb || !donor || !donor.phone) return;

      if (donorFoodChannel) {
        window.sb.removeChannel(donorFoodChannel);
      }

      donorFoodChannel = window.sb.channel(`donor-food-${donor.phone}`)
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'food_table'
          },
          (payload) => {
            const newRow = payload.new || {};
            const oldRow = payload.old || {};
            const belongsToDonor = newRow.donor_phone === donor.phone || oldRow.donor_phone === donor.phone;

            if (belongsToDonor) {
              loadDonations();
            }
          }
        )
        .subscribe();
    }

    async function acceptRequest(foodId) {
      if (!confirm('Accept this NGO request? The NGO will be notified to pick up the food.')) return;

      const { error } = await window.sb.from('food_table')
        .update({ status: 'Accepted' })
        .eq('id', foodId);

      if (error) {
        console.error(error);
        showAlert('Error accepting request', 'error');
        return;
      }

      showAlert('✅ Request accepted! NGO has been notified.', 'success');
      loadDonations();
    }

    async function rejectRequest(foodId) {
      if (!confirm('Reject this NGO request? The food will become available for other NGOs.')) return;

      const { error } = await window.sb.from('food_table')
        .update({
          status: 'available',
          ngo_phone: null
        })
        .eq('id', foodId);

      if (error) {
        console.error(error);
        showAlert('Error rejecting request', 'error');
        return;
      }

      showAlert('Request rejected. Food is now available for other NGOs.', 'info');
      loadDonations();
    }

    loadDonations();
    subscribeToDonationUpdates();
  </script>
  <script src="../script.js"></script>
</body>

</html>
