<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Food Status</title>

<style>
 body{
   font-family: Arial, Helvetica, sans-serif;
   background:#f7fbf9;
   margin:0;
   padding:18px;
 }
 .card{
   max-width:600px;
   margin:20px auto;
   background:#fff;
   padding:18px;
   border-radius:12px;
   box-shadow:0 8px 20px rgba(0,0,0,0.08);
 }
 img{
   width:100%;
   max-height:250px;
   object-fit:cover;
   border-radius:10px;
 }
 .row{
   display:flex;
   justify-content:space-between;
   align-items:center;
   margin-top:12px;
 }
 .badge{
   padding:6px 12px;
   border-radius:20px;
   background:#eee;
   font-weight:600;
 }
 .btn{
   margin-top:14px;
   padding:10px 14px;
   border:none;
   border-radius:8px;
   background:#2f7a4e;
   color:#fff;
   cursor:pointer;
 }
 .small{
   font-size:13px;
   color:#666;
 }
</style>
</head>

<body>

<div class="card" id="card">
  <div>Loading...</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const foodId = params.get("id");

  const allFoods = JSON.parse(localStorage.getItem("foodListings") || "[]");
  const food = allFoods.find(f => f.id === foodId);

  const card = document.getElementById("card");

  if (!food) {
    card.innerHTML = `
      <h3>Food not found</h3>
      <button class="btn" onclick="location.href='donor-home.html'">Back</button>
    `;
  } else {
    card.innerHTML = `
      ${food.photo ? `<img src="${food.photo}">` : ""}
      <div class="row">
        <strong>${food.type} • Serves ${food.serves}</strong>
        <div class="badge" id="status">${food.status}</div>
      </div>

      <p class="small">Valid for: ${food.validHours} hour(s)</p>
      <p class="small">Location: ${food.location}</p>
      <p class="small">Posted at: ${new Date(food.postedAt).toLocaleString()}</p>

      <div id="actions"></div>
    `;

    renderActions(food.status);
  }

  function updateStatus(newStatus){
    const idx = allFoods.findIndex(f => f.id === foodId);
    allFoods[idx].status = newStatus;
    localStorage.setItem("foodListings", JSON.stringify(allFoods));
    document.getElementById("status").textContent = newStatus;
    renderActions(newStatus);
  }

  function renderActions(status){
    const actions = document.getElementById("actions");
    actions.innerHTML = "";

    if(status === "Posted"){
      actions.innerHTML = `<button class="btn" onclick="updateStatus('Volunteer Assigned')">Simulate Volunteer Assigned</button>`;
    }
    else if(status === "Volunteer Assigned"){
      actions.innerHTML = `<button class="btn" onclick="updateStatus('Picked Up')">Simulate Picked Up</button>`;
    }
    else{
      actions.innerHTML = `<p class="small">Food has been picked up.</p>`;
    }

    actions.innerHTML += `<br><button class="btn" style="background:#666" onclick="location.href='donor-home.html'">Back</button>`;
  }
</script>

</body>
</html>
