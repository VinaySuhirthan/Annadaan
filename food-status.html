<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Track Donation — Annadaan</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <style>
    body {
      background:
        radial-gradient(circle at top left, rgba(24, 24, 27, 0.08), transparent 24%),
        radial-gradient(circle at top right, rgba(82, 82, 91, 0.08), transparent 22%),
        linear-gradient(180deg, #f8fbff 0%, #f8fafc 100%);
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.8);
      min-height: 100vh;
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.10);
      backdrop-filter: blur(16px);
    }

    .status-header {
      padding: 24px 20px 18px;
      background: rgba(255, 255, 255, 0.8);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gray);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 12px;
      transition: var(--transition);
    }

    .back-link:hover {
      color: var(--primary);
      transform: translateX(-3px);
    }

    .status-badge-lg {
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .timeline {
      position: relative;
      padding-left: 40px;
      margin: 32px 0;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 11px;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, rgba(24, 24, 27, 0.14), rgba(82, 82, 91, 0.12));
      border-radius: 4px;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 40px;
    }

    .timeline-dot {
      position: absolute;
      left: -40px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      border: 3px solid rgba(148, 163, 184, 0.28);
      transition: var(--transition);
      z-index: 10;
    }

    .timeline-item.active .timeline-dot {
      border-color: var(--primary);
      background: var(--grad-primary);
      box-shadow: 0 0 0 8px rgba(24, 24, 27, 0.08);
    }

    .timeline-item.active::after {
      content: '';
      position: absolute;
      left: -29px;
      top: 0;
      bottom: -40px;
      width: 3px;
      background: linear-gradient(180deg, #18181b, #52525b);
      z-index: 1;
    }

    .timeline-item:last-child.active::after {
      display: none;
    }

    .timeline-content {
      padding: 4px 0;
    }

    .timeline-content h4 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--gray-light);
    }

    .timeline-item.active h4 {
      color: var(--dark);
    }

    .timeline-content p {
      font-size: 14px;
      color: var(--gray);
    }

    .volunteer-card {
      background: linear-gradient(135deg, rgba(37,99,235,0.08), rgba(124,58,237,0.08));
      border: 1px solid rgba(24, 24, 27, 0.10);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    .volunteer-icon {
      width: 48px;
      height: 48px;
      background: var(--grad-primary);
      color: white;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 14px 28px rgba(24, 24, 27, 0.14);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="status-header">
      <a href="donor/donor-home.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </a>
      <h2 style="font-weight: 700; letter-spacing: -0.01em;">Donation Status</h2>
    </div>

    <div style="padding: 24px;">
      <div id="foodContent">
        <div class="spinner"></div>
      </div>

      <div id="timelineContent" class="timeline"></div>

      <div id="actions" style="margin-top: 32px; padding-bottom: 48px;"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const foodId = params.get("id");
    let currentFood = null;

    async function getAssigneeContact(food) {
      if (!food) return null;

      if (food.volunteer_phone) {
        const fallback = {
          roleLabel: 'Volunteer Contact',
          typeLabel: 'Volunteer',
          phone: food.volunteer_phone,
          name: 'Volunteer'
        };

        try {
          const { data, error } = await window.sb.from('volunteer_table')
            .select('name, phone')
            .eq('phone', food.volunteer_phone)
            .single();

          if (error || !data) return fallback;
          return {
            roleLabel: 'Volunteer Contact',
            typeLabel: 'Volunteer',
            phone: data.phone || food.volunteer_phone,
            name: data.name || 'Volunteer'
          };
        } catch (err) {
          console.error('Error loading volunteer contact:', err);
          return fallback;
        }
      }

      if (food.ngo_phone) {
        const fallback = {
          roleLabel: 'NGO Contact',
          typeLabel: 'NGO',
          phone: food.ngo_phone,
          name: 'NGO'
        };

        try {
          const { data, error } = await window.sb.from('ngo_table')
            .select('name, phone')
            .eq('phone', food.ngo_phone)
            .single();

          if (error || !data) return fallback;
          return {
            roleLabel: 'NGO Contact',
            typeLabel: 'NGO',
            phone: data.phone || food.ngo_phone,
            name: data.name || 'NGO'
          };
        } catch (err) {
          console.error('Error loading NGO contact:', err);
          return fallback;
        }
      }

      return null;
    }

    async function loadStatus() {
      if (!foodId) return showAlert("No donation ID provided", "error");

      const { data: food, error } = await window.sb.from('food_table')
        .select('*')
        .eq('id', foodId)
        .single();

      if (error || !food) {
        console.error(error);
        document.getElementById("foodContent").innerHTML = `
          <div class="card" style="text-align: center;">
            <i class="fas fa-search-minus" style="font-size: 3rem; color: #E2E8F0; margin-bottom: 16px;"></i>
            <h3>Donation not found</h3>
            <button class="btn btn-primary" style="margin-top: 24px; width: 100%;" onclick="location.href='donor/donor-home.html'">Go Back</button>
          </div>`;
        return;
      }

      currentFood = food;

      const assigneeContact = await getAssigneeContact(food);

      const foodContent = document.getElementById("foodContent");
      foodContent.innerHTML = `
        <div style="position: relative;">
          <img src="${food.photo_url || 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?q=80&w=1470&auto=format&fit=crop'}" style="width: 100%; height: 220px; object-fit: cover; border-radius: 20px; margin-bottom: 24px; box-shadow: var(--shadow-lg);">
          <div style="position: absolute; top: 12px; right: 12px;">
             <span class="status-badge status-${getStatusClass(food.status)}">${food.status}</span>
          </div>
        </div>

        <div class="card" style="padding: 20px;">
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 12px;">${food.food_type}</h3>
          <div style="display: flex; gap: 20px; color: var(--gray); font-size: 14px; font-weight: 600;">
             <span><i class="fas fa-users" style="color: var(--primary);"></i> Serves ${food.serves}</span>
             <span><i class="fas fa-clock" style="color: var(--primary);"></i> Fresh: ${food.valid_hours || 0}h</span>
          </div>
        </div>

        ${assigneeContact ? `
            <div class="volunteer-card animate-fade-in">
                <div class="volunteer-icon">
                    <i class="fas fa-hands-helping"></i>
                </div>
                <div>
                    <h4 style="font-size: 14px; text-transform: uppercase; color: var(--primary-dark); letter-spacing: 0.05em; font-weight: 700;">${assigneeContact.roleLabel}</h4>
                    <p style="font-weight: 700; margin-top: 2px;">${assigneeContact.name}</p>
                    <p style="font-weight: 600; margin-top: 4px;">Phone: ${assigneeContact.phone}</p>
                    <a href="tel:${assigneeContact.phone}" style="display: inline-block; margin-top: 8px; color: var(--primary); font-weight: 700; text-decoration: none; font-size: 13px;">
                        <i class="fas fa-phone-alt"></i> Call ${assigneeContact.typeLabel}
                    </a>
                </div>
            </div>
        ` : ''}
      `;

      // Update Back Link based on user type
      const user = JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('donor'));
      const backLink = document.querySelector('.back-link');
      if (user) {
        if (user.type === 'ngo') {
          backLink.href = 'volunteer/my-requests.html';
          backLink.innerHTML = '<i class="fas fa-arrow-left"></i> Back to My Requests';
        } else if (user.type === 'donor') {
          backLink.href = 'donor/donor-home.html';
          backLink.innerHTML = '<i class="fas fa-arrow-left"></i> Back to Dashboard';
        } else if (user.type === 'volunteer') {
          backLink.href = 'volunteer/my-volunteering.html';
          backLink.innerHTML = '<i class="fas fa-arrow-left"></i> Back to Volunteering';
        }
      }

      // Timeline Logic
      const stages = [
        { name: 'Posted', label: 'Food details posted by donor', keys: ['Posted'] },
        { name: 'NGO/Volunteer Assigned', label: 'NGO/Volunteer matched to the order', keys: ['NGO Requested'] },
        { name: 'Order Accepted', label: 'Order accepted by NGO/Volunteer', keys: ['Accepted'] },
        { name: 'Picked Up', label: 'Food handed over to NGO/Volunteer', keys: ['Picked Up'] },
        { name: 'Delivered', label: 'Food delivery completed', keys: ['Delivered'] }
      ];

      // Map current status to stage index
      let currentIdx = -1;
      const currentStatus = food.status;

      // Find the highest stage reached
      stages.forEach((stage, idx) => {
        if (stage.keys.includes(currentStatus)) {
          currentIdx = idx;
        }
      });

      // If status isn't explicitly in keys, try to find by string match or sequence
      if (currentIdx === -1) {
        if (currentStatus === 'Delivered') currentIdx = 4;
        else if (currentStatus === 'Picked Up') currentIdx = 3;
        else if (currentStatus === 'Accepted') currentIdx = 2;
        else if (currentStatus === 'NGO Requested') currentIdx = 1;
        else currentIdx = 0;
      }

      const timelineContent = document.getElementById("timelineContent");
      timelineContent.innerHTML = "";

      const currentUserForTimeline = JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('donor'));

      stages.forEach((stage, idx) => {
        // HIDE 'Posted' ONLY for NGOs.
        const isNGO = currentUserForTimeline && currentUserForTimeline.type === 'ngo';
        if (stage.name === 'Posted' && isNGO) return;

        // HIDE 'Posted' AND 'NGO/Volunteer Assigned' for Volunteers
        const isVolunteer = currentUserForTimeline && currentUserForTimeline.type === 'volunteer';
        if ((stage.name === 'Posted' || stage.name === 'NGO/Volunteer Assigned') && isVolunteer) return;

        // HIDE 'Order Accepted' ONLY for Donors (Show for NGO)
        const isDonor = currentUserForTimeline && currentUserForTimeline.type === 'donor';
        if (stage.name === 'Order Accepted' && isDonor) return;

        const isPast = idx < currentIdx;
        const isCurrent = idx === currentIdx;
        const isActiveOrPast = idx <= currentIdx;

        timelineContent.innerHTML += `
          <div class="timeline-item ${isActiveOrPast ? 'active' : ''}">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
              <h4>${stage.name}</h4>
              <p>${isCurrent ? 'Current' : (isPast ? 'Completed' : 'Awaiting')}: ${stage.label}</p>
            </div>
          </div>
        `;
      });

      renderActions(food.status);
    }


    function getStatusClass(status) {
      if (status === 'Accepted') return 'accepted';
      if (status === 'Picked Up') return 'picked';
      if (status === 'Delivered') return 'completed';
      if (status === 'NGO Requested') return 'pending';
      return 'pending';
    }

    async function updateStatus(newStatus) {
      if (confirm(`Mark this donation as ${newStatus}?`)) {
        const btn = event.target;
        const oldText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';

        const { error } = await window.sb.from('food_table')
          .update({ status: newStatus })
          .eq('id', foodId);

        if (error) {
          console.error(error);
          btn.disabled = false;
          btn.innerHTML = oldText;
          return showAlert("Error updating status", "error");
        }
        loadStatus();
      }
    }

    function renderActions(status) {
      const actions = document.getElementById("actions");
      actions.innerHTML = "";

      // Get user context
      const user = JSON.parse(localStorage.getItem('currentUser') || localStorage.getItem('donor'));
      if (!user) return;

      if (user.type === 'donor') {
        renderDonorActions(actions, status);
      } else if (user.type === 'ngo') {
        renderNGOActions(actions, status);
      } else if (user.type === 'volunteer') {
        renderVolunteerActions(actions, status);
      }

      // Shared Success Message
      if (status === "Delivered") {
        actions.innerHTML += `
            <div class="card animate-fade-in" style="background: var(--grad-primary); color: white; border: none; text-align: center;">
                <i class="fas fa-heart" style="font-size: 2rem; margin-bottom: 12px;"></i>
                <h3 style="margin-bottom: 4px;">Mission Accomplished!</h3>
                <p style="opacity: 0.9;">The food has reached those in need. ${user.type === 'donor' ? 'Thank you for your donation!' : ''}</p>
            </div>
          `;

        // If NGO viewing, show feedback form (only if not already provided)
        if (user.type === 'ngo') {
          const feedbackSectionId = `ngoFeedbackSection-${foodId}`;
          const feedbackBtnId = `openFeedbackBtn-${foodId}`;
          actions.innerHTML += `
            <div id="${feedbackSectionId}" class="card" style="margin-top:12px; padding:14px;">
              <h4 style="margin-bottom:8px;">Confirm Delivery & Provide Feedback</h4>
              <div id="feedbackFormContainer">
                <button id="${feedbackBtnId}" class="btn btn-primary" style="width:100%;">Provide Feedback</button>
                <p style="color:var(--gray); margin-top:8px; font-size:13px;">Click to open the simple feedback page.</p>
              </div>
            </div>
          `;

          // Attach click handler safely
          setTimeout(() => {
            const openBtn = document.getElementById(feedbackBtnId);
            if (openBtn) {
              openBtn.addEventListener('click', () => {
                window.location.href = `volunteer/delivery-feedback.html?id=${foodId}`;
              });
            }
          }, 50);
        }
      }

      // Shared Dashboard Link
      const backHome = user.type === 'ngo' ? 'volunteer/ngo-dashboard.html' : (user.type === 'volunteer' ? 'volunteer/volunteer-dashboard.html' : 'donor/donor-home.html');
      actions.innerHTML += `<a href="${backHome}" class="btn btn-secondary" style="width: 100%; margin-top: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center;">
        <i class="fas fa-home"></i> Back to Dashboard
      </a>`;
    }

    // --- Role-Specific Action Renderers ---

    function renderDonorActions(container, status) {
      if (status === "NGO Requested") {
        container.innerHTML = `
            <div class="card" style="padding: 18px;">
                <h4 style="margin-bottom: 8px;">Volunteer requested this donation</h4>
                <p style="font-size: 13px; color: var(--gray); margin-bottom: 16px;">
                    Review the request here. Once you accept it, this page will move to pickup confirmation.
                </p>
                <div style="display: flex; gap: 12px;">
                    <button class="btn btn-primary" onclick="acceptRequest()" style="flex: 1;">
                        <i class="fas fa-check"></i> Accept
                    </button>
                    <button class="btn btn-secondary" onclick="rejectRequest()" style="flex: 1; color: #ef4444; border-color: #ef4444;">
                        <i class="fas fa-times"></i> Reject
                    </button>
                </div>
            </div>
        `;
      } else if (status === "Accepted") {
        container.innerHTML = `
            <button class="btn btn-primary" onclick="updateStatus('Picked Up')" style="width: 100%;">
                <i class="fas fa-truck-pickup"></i> Confirm Food Picked Up
            </button>
            <p style="text-align: center; font-size: 13px; color: var(--gray); margin-top: 12px; font-weight: 500;">
                Click this once the NGO arrives and picks up the food.
            </p>
        `;
      }
    }

    async function acceptRequest() {
      if (!confirm('Accept this volunteer request? They will be notified to pick up the food.')) return;

      try {
        const { error } = await window.sb.from('food_table')
          .update({ status: 'Accepted' })
          .eq('id', foodId);

        if (error) throw error;

        showAlert('Request accepted. Pickup confirmation is now enabled.', 'success');
        loadStatus();
      } catch (err) {
        console.error(err);
        showAlert('Error accepting request', 'error');
      }
    }

    async function rejectRequest() {
      if (!confirm('Reject this volunteer request? The donation will become available again.')) return;

      try {
        const { error } = await window.sb.from('food_table')
          .update({
            status: 'available',
            ngo_phone: null
          })
          .eq('id', foodId);

        if (error) throw error;

        showAlert('Request rejected. The donation is available again.', 'info');
        loadStatus();
      } catch (err) {
        console.error(err);
        showAlert('Error rejecting request', 'error');
      }
    }

    function renderNGOActions(container, status) {
      if (status === 'NGO Requested') {
        container.innerHTML = `
            <div class="card" style="padding: 16px; background: #FEF3C7; border: 1px solid #FCD34D; text-align: center; font-size: 13px; color: #92400E; width: 100%;">
                <i class="fas fa-clock"></i> Waiting for donor to accept your request...
            </div>
        `;
      } else if (status === 'Accepted') {
        container.innerHTML = `
            <div class="card" style="padding: 16px; background: #DBEAFE; border: 1px solid #93C5FD; text-align: center; font-size: 13px; color: #1E40AF; width: 100%;">
                <i class="fas fa-check-circle"></i> Donor accepted! Waiting for pickup confirmation...
            </div>
        `;
      } else if (status === 'Picked Up') {
        container.innerHTML = `
            <button class="btn btn-primary" onclick="updateStatus('Delivered')" style="width: 100%;">
                <i class="fas fa-check-circle"></i> Confirm Delivery to Needy
            </button>
            <p style="text-align: center; font-size: 13px; color: var(--gray); margin-top: 12px; font-weight: 500;">
                Click this once you've delivered the food to people in need.
            </p>
        `;
      }
    }

    // Render NGO feedback form after Delivered status
    async function renderNGOFeedbackForm() {
      const container = document.getElementById('feedbackFormContainer');
      if (!container) return;

      try {
        // Show a clear loading indicator (in case it takes a moment)
        container.innerHTML = '<div style="color:var(--gray);">Loading feedback form...</div>';

        if (!window.sb) {
          throw new Error('Supabase client not available');
        }

        // Load current food data to prefill
        const { data: food, error } = await window.sb.from('food_table').select('*').eq('id', foodId).single();
        if (error || !food) {
          console.error('Error loading food for feedback:', error);
          container.innerHTML = '<p style="color:var(--danger);">Unable to load feedback form. Please try again later.</p>';
          return;
        }

        // If feedback already exists, show summary
        if (food.people_served || food.delivery_feedback) {
          container.innerHTML = `
            <div style="font-size:14px; color:var(--dark);">
              <div><strong>People served:</strong> ${food.people_served || '—'}</div>
              <div style="margin-top:6px;"><strong>Notes:</strong> ${food.delivery_feedback || '—'}</div>
              <div style="margin-top:6px;"><strong>Delivered at:</strong> ${food.delivered_at ? new Date(food.delivered_at).toLocaleString() : '—'}</div>
            </div>
          `;
          return;
        }

        // Show form
        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:8px;">
            <label style="font-size:13px; color:var(--gray);">People served</label>
            <input id="peopleServedInput" type="number" min="0" placeholder="Number of people served" style="padding:8px; border-radius:8px; border:1px solid #E6E9EE;">

            <label style="font-size:13px; color:var(--gray);">Delivery location (lat,lng) — optional</label>
            <div style="display:flex; gap:8px;">
              <input id="latConfirm" placeholder="Latitude" style="flex:1; padding:8px; border-radius:8px; border:1px solid #E6E9EE;" value="${food.delivery_lat || ''}">
              <input id="lngConfirm" placeholder="Longitude" style="flex:1; padding:8px; border-radius:8px; border:1px solid #E6E9EE;" value="${food.delivery_lng || ''}">
            </div>

            <label style="font-size:13px; color:var(--gray);">Notes (optional)</label>
            <textarea id="notesInput" rows="3" placeholder="Any notes about delivery or location" style="padding:8px; border-radius:8px; border:1px solid #E6E9EE;"></textarea>

            <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:6px;">
              <button id="submitFeedbackBtn" class="btn btn-primary">Submit Feedback</button>
            </div>
          </div>
        `;

        // Attach handler safely (guard against missing DOM)
        const submitBtn = container.querySelector('#submitFeedbackBtn');
        if (!submitBtn) {
          console.warn('submitFeedbackBtn not found in DOM');
          container.innerHTML = '<p style="color:var(--danger);">Feedback form unavailable.</p>';
          return;
        }

        submitBtn.addEventListener('click', async (ev) => {
          try {
            ev.preventDefault();
            const peopleEl = container.querySelector('#peopleServedInput');
            const latEl = container.querySelector('#latConfirm');
            const lngEl = container.querySelector('#lngConfirm');
            const notesEl = container.querySelector('#notesInput');

            const people = peopleEl ? parseInt(peopleEl.value) || null : null;
            const lat = latEl ? parseFloat(latEl.value) || null : null;
            const lng = lngEl ? parseFloat(lngEl.value) || null : null;
            const notes = notesEl ? notesEl.value.trim() || null : null;

            if (!people || people <= 0) return showAlert('Please enter number of people served', 'error');

            submitBtn.disabled = true;
            const oldText = submitBtn.textContent;
            submitBtn.textContent = 'Saving...';

            const user = JSON.parse(localStorage.getItem('currentUser')) || {};
            const updates = { people_served: people, delivery_feedback: notes, delivered_at: new Date().toISOString(), delivered_by: user.phone || user.id || user.name };
            if (lat) updates.delivery_lat = lat;
            if (lng) updates.delivery_lng = lng;

            if (!window.sb) throw new Error('Supabase client not available');

            const { error } = await window.sb.from('food_table').update(updates).eq('id', foodId);
            if (error) throw error;

            showAlert('Thank you — feedback saved.', 'success');
            // Refresh UI
            loadStatus();
          } catch (e) {
            console.error('Error saving feedback:', e);
            showAlert('Error saving feedback. Changes may be saved locally.', 'error');
            // Local fallback
            try {
              let allFeedback = JSON.parse(localStorage.getItem('foodbridge_feedback')) || [];
              allFeedback.push({ foodId, people: parseInt(container.querySelector('#peopleServedInput')?.value) || null, notes: container.querySelector('#notesInput')?.value || null, lat: parseFloat(container.querySelector('#latConfirm')?.value) || null, lng: parseFloat(container.querySelector('#lngConfirm')?.value) || null, submittedAt: new Date().toISOString() });
              localStorage.setItem('foodbridge_feedback', JSON.stringify(allFeedback));
              loadStatus();
            } catch (localErr) {
              console.error('Local save failed', localErr);
            }
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Submit Feedback';
            }
          }
        });
      } catch (ex) {
        console.error('renderNGOFeedbackForm exception:', ex);
        container.innerHTML = '<p style="color:var(--danger);">Unable to load feedback. Please try again later.</p>';
      }
    }

    function renderVolunteerActions(container, status) {
      // Placeholder for volunteer actions if needed in future
      if (status === 'Accepted' || status === 'NGO Requested') {
        container.innerHTML = `
              <div class="card" style="padding: 16px; background: #F8FAFC; border: none; text-align: center; font-size: 13px; color: var(--gray); width: 100%;">
                  <i class="fas fa-clock"></i> Waiting for pickup...
              </div>
          `;
      } else if (status === 'Picked Up') {
        container.innerHTML = `
            <button class="btn btn-primary" onclick="updateStatus('Delivered')" style="width: 100%;">
                <i class="fas fa-check-circle"></i> Confirm Delivery to Needy
            </button>
            <p style="text-align: center; font-size: 13px; color: var(--gray); margin-top: 12px; font-weight: 500;">
                Click this once you've delivered the food.
            </p>
        `;
      }
    }

    async function updateStatus(newStatus) {
      if (!confirm(`Are you sure you want to update status to "${newStatus}"?`)) return;

      try {
        // Precise update using ONLY 'status' column as requested
        const { error } = await window.sb.from('food_table')
          .update({
            status: newStatus
          })
          .eq('id', foodId);

        if (error) throw error;

        // Optimistic update
        renderActions(newStatus);

        // Reload full data to be safe
        loadStatus();

      } catch (err) {
        console.error(err);
        showAlert("Error updating status: " + err.message, "error");
      }
    }

    // Realtime Subscription
    window.sb.channel('public:food_table')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'food_table', filter: `id=eq.${foodId}` }, (payload) => {
        console.log('Update received!', payload);
        loadStatus();
      })
      .subscribe();

    loadStatus();
  </script>
  <script src="script.js"></script>
</body>

</html>
