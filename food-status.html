<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Track Donation — Annadaan</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <style>
    /* --- Global Styles from index.css --- */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    :root {
      --primary: #2D6A4F;
      --primary-light: #40916C;
      --primary-dark: #1B4332;
      --secondary: #52B788;
      --accent: #B7E4C7;
      --background: #F8FAF9;
      --surface: #FFFFFF;
      --text-main: #1A1C1E;
      --text-muted: #64748B;
      --error: #EF4444;
      --success: #10B981;
      --warning: #F59E0B;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-premium: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--background);
      color: var(--text-main);
      line-height: 1.5;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--surface);
      box-shadow: var(--shadow-premium);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0, 0, 0, 0.04);
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      width: 100%;
      text-decoration: none;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(45, 106, 79, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .animate-fade-in {
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .status-header {
      background: white;
      color: var(--text-main);
      padding: 16px 20px;
      border-bottom: 1px solid #F1F5F9;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .status-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 20px;
      margin-top: 24px;
      box-shadow: var(--shadow-md);
    }

    .timeline {
      position: relative;
      padding-left: 32px;
      margin-top: 24px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 5px;
      bottom: 5px;
      width: 2px;
      background: #E2E8F0;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 32px;
    }

    .timeline-dot {
      position: absolute;
      left: -32px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      border: 3px solid #E2E8F0;
      z-index: 2;
    }

    .timeline-item.active .timeline-dot {
      border-color: var(--primary);
      background: var(--primary);
      box-shadow: 0 0 0 4px var(--accent);
    }

    .timeline-content {
      background: white;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #F1F5F9;
    }

    .timeline-content h4 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .timeline-content p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="container" style="background: var(--background);">
    <div class="status-header">
      <button onclick="location.href='donor-home.html'"
        style="background:none; border:none; color:var(--text-main); cursor:pointer; margin-bottom:12px; display:flex; align-items:center; gap:4px; font-weight:500;">
        ← Back
      </button>
      <h3>Donation Tracking</h3>
      <p style="opacity: 0.8; font-size: 14px;">Real-time update on your shared meal</p>
    </div>

    <div style="padding: 0 20px;">
      <div id="foodContent">
        <div style="text-align: center; padding: 100px 0;">Loading...</div>
      </div>

      <div id="timelineContent" class="timeline"></div>

      <!-- Popup removed per user request -->

      <div id="actions" style="margin-top: 24px; padding-bottom: 40px;"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const foodId = params.get("id");

    async function loadStatus() {
      if (!foodId) return alert("No donation ID provided");

      const { data: food, error } = await window.sb.from('food_table')
        .select('*')
        .eq('id', foodId)
        .single();

      if (error || !food) {
        console.error(error);
        document.getElementById("foodContent").innerHTML = `
          <div class="card" style="margin-top: 40px; text-align: center;">
            <h3>Donation not found</h3>
            <button class="btn btn-primary" style="margin-top: 16px;" onclick="location.href='donor-home.html'">Go Back</button>
          </div>`;
        return;
      }

      const foodContent = document.getElementById("foodContent");
      foodContent.innerHTML = `
        <img src="${food.photo_url || 'https://via.placeholder.com/400/F1F5F9/2D6A4F?text=No+Photo'}" class="status-image">
        <div class="card glass" style="margin-top: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: start;">
            <div>
              <h4 style="font-size: 18px; color: var(--primary-dark);">${food.food_type}</h4>
              <p style="font-size: 14px; color: var(--text-muted);">Serves ${food.serves} people</p>
            </div>
            <span class="status-pill active" style="background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700;">${food.status}</span>
          </div>
          <hr style="opacity: 0.05; margin: 16px 0;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div>
              <label style="margin-bottom: 2px;">Fresh for</label>
              <div style="font-weight:600; font-size: 14px;">${food.valid_hours || 0} hours</div>
            </div>
            <div>
              <label style="margin-bottom: 2px;">Posted</label>
              <div style="font-weight:600; font-size: 14px;">${new Date(food.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
            </div>
          </div>
        </div>
      `;

      // Timeline Logic
      const stages = ['Posted', 'Volunteer Assigned', 'Picked Up', 'Delivered'];
      const currentIdx = stages.indexOf(food.status);
      const timelineContent = document.getElementById("timelineContent");
      timelineContent.innerHTML = "";

      stages.forEach((stage, idx) => {
        const isPast = idx <= currentIdx;
        timelineContent.innerHTML += `
          <div class="timeline-item ${isPast ? 'active' : ''}">
            <div class="timeline-dot"></div>
            <div class="timeline-content">
              <h4>${stage}</h4>
              <p>${isPast ? 'Task completed successfully' : 'Awaiting completion'}</p>
            </div>
          </div>
        `;
      });

      if (food.status === 'Delivered') {
        // document.getElementById("successMsg").style.display = "block";
        document.getElementById("actions").style.display = "none";
      } else {
        renderActions(food.status);
      }
    }

    async function updateStatus(newStatus) {
      const { error } = await window.sb.from('food_table')
        .update({ status: newStatus })
        .eq('id', foodId);

      if (error) {
        console.error(error);
        return alert("Error updating status");
      }
      location.reload();
    }

    function renderActions(status) {
      const actions = document.getElementById("actions");
      actions.innerHTML = "";

      if (status === "Posted") {
        actions.innerHTML = `<button class="btn btn-primary" onclick="updateStatus('Volunteer Assigned')">Simulate Volunteer Assignment</button>`;
      }
      else if (status === "Volunteer Assigned") {
        actions.innerHTML = `<button class="btn btn-primary" onclick="updateStatus('Picked Up')">Simulate Pickup</button>`;
      }
      else if (status === "Picked Up") {
        actions.innerHTML = `<button class="btn btn-primary" onclick="updateStatus('Delivered')">Simulate Delivery</button>`;
      }

      actions.innerHTML += `<button class="btn btn-outline" style="margin-top: 12px;" onclick="location.href='donor-home.html'">Back to Dashboard</button>`;
    }

    loadStatus();
  </script>
</body>

</html>
