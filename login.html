<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donor Login</title>

<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  background:#f7fbf9;
  padding:20px;
}
.card{
  max-width:420px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}
h3{margin-top:0}
label{
  font-size:13px;
  font-weight:600;
  margin-top:12px;
  display:block;
}
input,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:14px;
}
button{
  background:#2f7a4e;
  color:#fff;
  border:none;
  margin-top:16px;
  cursor:pointer;
}
.note{
  font-size:13px;
  color:#2a9da6;
  text-align:center;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">

<h3>Donor Login</h3>

<!-- STEP 1 -->
<div id="step1">
  <label>Name *</label>
  <input id="nameInput" placeholder="Full name">

  <label>Phone Number *</label>
  <input id="phoneInput" maxlength="10" placeholder="10-digit phone number">

  <button onclick="sendOtp()">Send OTP</button>
</div>

<!-- STEP 2 -->
<div id="step2" style="display:none">
  <label>Enter OTP</label>
  <input id="otpInput" placeholder="1234">
  <button onclick="verifyOtp()">Verify & Continue</button>
  <div class="note">Demo OTP: <b>1234</b></div>
</div>

</div>

<script>
const nextPage =
  new URLSearchParams(location.search).get("next")
  || "donor-home.html";

function validPhone(p){
  return /^[0-9]{10}$/.test(p);
}

function sendOtp(){
  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();

  if(!name){
    alert("Enter your name");
    return;
  }
  if(!validPhone(phone)){
    alert("Enter a valid 10-digit phone number");
    return;
  }

  sessionStorage.setItem("otp","1234");
  sessionStorage.setItem("loginData", JSON.stringify({
    name,
    phone,
    createdAt: Date.now()
  }));

  step1.style.display="none";
  step2.style.display="block";
}

function verifyOtp(){
  if(otpInput.value.trim() !== "1234"){
    alert("Invalid OTP");
    return;
  }

  const data = JSON.parse(sessionStorage.getItem("loginData"));

  // Create donor profile with minimal info
  const donor = {
    name: data.name,
    phone: data.phone,
    createdAt: data.createdAt
    // other profile fields added later
  };

  localStorage.setItem("donor", JSON.stringify(donor));
  sessionStorage.clear();

  location.href = nextPage;
}
</script>

</body>
</html>
