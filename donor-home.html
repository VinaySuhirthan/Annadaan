<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donor</title>

<style>
body{margin:0;font-family:Arial;background:#f7fbf9}

/* HEADER */
.header{
  display:flex;align-items:center;
  padding:14px 16px;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.1)
}
.menu{font-size:26px;cursor:pointer}
.title{margin-left:14px;font-size:18px;font-weight:600}

/* SIDEBAR */
.sidebar{
  position:fixed;top:0;left:-260px;
  width:260px;height:100%;
  background:#fff;
  box-shadow:2px 0 10px rgba(0,0,0,.2);
  transition:.3s;z-index:1000
}
.sidebar.open{left:0}
.side-header{background:#2f7a4e;color:#fff;padding:18px}
.side-item{
  padding:14px 18px;
  border-bottom:1px solid #eee;
  cursor:pointer;font-weight:600
}
.side-item:hover{background:#f1f1f1}

/* OVERLAY */
.overlay{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,.35);
  display:none;z-index:999
}
.overlay.show{display:block}

/* TABS (NEW) */
.tabs{
  display:flex;
  background:#fff;
  border-bottom:1px solid #ddd;
}
.tab{
  flex:1;
  text-align:center;
  padding:12px;
  font-weight:600;
  color:#666;
  cursor:pointer;
}
.tab.active{
  color:#2f7a4e;
  border-bottom:3px solid #2f7a4e;
}

/* CONTENT */
.content{padding:16px}
.card{
  background:#fff;padding:16px;
  border-radius:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.06)
}
.small{font-size:13px;color:#666}
.food{display:flex;gap:12px;margin-top:12px}
.food img{width:80px;height:60px;background:#eee;border-radius:8px}
.link{color:#2f7a4e;font-weight:600;cursor:pointer}

/* PROFILE */
.row{margin-bottom:14px}
.label{font-size:12px;color:#777}
.value{font-size:15px;font-weight:600}

/* FAB */
.fab{
  position:fixed;right:24px;bottom:24px;
  width:64px;height:64px;
  background:#2f7a4e;color:#fff;
  font-size:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  cursor:pointer
}
</style>
</head>

<body>

<script>
const donor = JSON.parse(localStorage.getItem("donor"));
if(!donor) location.href="login.html";
</script>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="side-header">
    <b id="sideName"></b><br>
    <span class="small" id="sidePhone"></span>
  </div>
  <div class="side-item" onclick="showProfile()">Profile</div>
  <div class="side-item" onclick="showDashboard()">My Dashboard</div>
  <div class="side-item" onclick="logout()">Logout</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- HEADER -->
<div class="header">
  <div class="menu" onclick="openMenu()">☰</div>
  <div class="title" id="pageTitle">Dashboard</div>
</div>

<!-- TABS (NEW) -->
<div class="tabs" id="homeTabs">
  <div class="tab active" id="tabListings" onclick="showListings()">Listings</div>
  <div class="tab" id="tabRequests" onclick="showRequests()">Requests</div>
</div>

<!-- DASHBOARD / LISTINGS -->
<div class="content" id="dashboardView">
  <div class="card">
    <div id="emptyListings" class="small">No food posted yet</div>
    <div id="listings"></div>
  </div>
</div>

<!-- REQUESTS VIEW (NEW) -->
<div class="content" id="requestsView" style="display:none">
  <div class="card">
    <div class="small">
      No requests yet.<br>
      Volunteer / NGO requests will appear here.
    </div>
  </div>
</div>

<!-- PROFILE VIEW -->
<div class="content" id="profileView" style="display:none">
  <div class="card">
    <div class="row"><div class="label">Name</div><div class="value" id="pName"></div></div>
    <div class="row"><div class="label">Phone</div><div class="value" id="pPhone"></div></div>
    <div class="row"><div class="label">Email</div><div class="value" id="pEmail"></div></div>
    <div class="row"><div class="label">Gender</div><div class="value" id="pGender"></div></div>
    <div class="row"><div class="label">Date of Birth</div><div class="value" id="pDob"></div></div>
    <div class="row"><div class="label">Member Since</div><div class="value" id="pSince"></div></div>
    <div class="row"><div class="label">Emergency Contact</div><div class="value" id="pEmergency"></div></div>
  </div>
</div>

<div class="fab" id="fab" onclick="location.href='add-food.html'">+</div>

<script>
/* SIDEBAR */
sideName.textContent = donor.name;
sidePhone.textContent = donor.phone;

function openMenu(){sidebar.classList.add("open");overlay.classList.add("show")}
function closeMenu(){sidebar.classList.remove("open");overlay.classList.remove("show")}
function logout(){localStorage.removeItem("donor");location.href="index.html"}

/* VIEW SWITCH */
function showProfile(){
  closeMenu();
  pageTitle.textContent = "Profile";
  homeTabs.style.display="none";
  dashboardView.style.display="none";
  requestsView.style.display="none";
  profileView.style.display="block";
  fab.style.display="none";
}
function showDashboard(){
  closeMenu();
  pageTitle.textContent = "Dashboard";
  homeTabs.style.display="flex";
  profileView.style.display="none";
  requestsView.style.display="none";
  dashboardView.style.display="block";
  fab.style.display="flex";
}

/* TAB SWITCH (NEW) */
function showListings(){
  tabListings.classList.add("active");
  tabRequests.classList.remove("active");
  dashboardView.style.display="block";
  requestsView.style.display="none";
}
function showRequests(){
  tabRequests.classList.add("active");
  tabListings.classList.remove("active");
  dashboardView.style.display="none";
  requestsView.style.display="block";
}

/* PROFILE DATA */
pName.textContent = donor.name || "Not added";
pPhone.textContent = donor.phone || "Not added";
pEmail.textContent = donor.email || "Not added";
pGender.textContent = donor.gender || "Not added";
pDob.textContent = donor.dob || "Not added";
pEmergency.textContent = donor.emergency || "Not added";

if(!donor.createdAt){
  donor.createdAt = Date.now();
  localStorage.setItem("donor", JSON.stringify(donor));
}
pSince.textContent =
  new Date(donor.createdAt).toLocaleDateString(undefined,{month:"long",year:"numeric"});

/* LOAD LISTINGS */
const foods = JSON.parse(localStorage.getItem("foodListings")||"[]")
  .filter(f=>f.donorPhone===donor.phone);

if(foods.length){
  emptyListings.style.display="none";
  foods.reverse().forEach(f=>{
    listings.innerHTML+=`
      <div class="food">
        <img>
        <div>
          <b>${f.type} • ${f.serves} people</b>
          <div class="small">${f.status}</div>
          <div class="link" onclick="location.href='food-status.html?id=${f.id}'">
            View Status
          </div>
        </div>
      </div>`;
  });
}
</script>

</body>
</html>
