<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Annadaan</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>

  <style>
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: white;
      box-shadow: 20px 0 50px rgba(0, 0, 0, 0.1);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      padding: 24px;
    }

    .sidebar.open {
      transform: translateX(280px);
    }

    .tabs-container {
      padding: 4px;
      background: #F1F5F9;
      border-radius: 14px;
      display: flex;
      margin: 16px 20px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--gray);
    }

    .tab.active {
      background: white;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .food-card {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 16px !important;
    }

    .food-img-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      background: #F1F5F9;
      overflow: hidden;
      flex-shrink: 0;
    }

    .food-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .food-info {
      flex: 1;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .fab {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 60px;
      height: 60px;
      background: var(--grad-primary);
      color: white;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 24px rgba(16, 185, 129, 0.3);
      cursor: pointer;
      z-index: 90;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      display: none;
      z-index: 999;
    }

    .overlay.show {
      display: block;
    }
  </style>
</head>

<body>
  <script>
    let donor = JSON.parse(localStorage.getItem("donor"));
    if (!donor) location.href = "login.html";
  </script>

  <div class="container"
    style="max-width: 480px; padding: 0; background: white; min-height: 100vh; box-shadow: var(--shadow-xl);">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header" style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px;">
        <div
          style="width: 48px; height: 48px; background: #f0fdf4; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary);">
          <i class="fas fa-user"></i>
        </div>
        <div>
          <span style="font-weight: 700; display: block;" id="sideName"></span>
          <span style="font-size: 12px; color: var(--gray);" id="sidePhone"></span>
        </div>
      </div>
      <div class="nav-item" onclick="showDashboard()"><i class="fas fa-home"></i> Home</div>
      <div class="nav-item" onclick="showProfile()"><i class="fas fa-user-circle"></i> Profile</div>
      <div class="nav-item logout" onclick="logout()" style="margin-top: 40px; color: var(--danger);"><i
          class="fas fa-sign-out-alt"></i> Logout</div>
    </div>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- HEADER -->
    <div class="app-header">
      <div onclick="openMenu()" style="cursor: pointer; color: var(--dark);"><i class="fas fa-bars fa-lg"></i></div>
      <div style="font-weight: 700; font-size: 18px; letter-spacing: -0.01em;" id="pageTitle">Annadaan</div>
      <div style="width: 24px;"></div>
    </div>

    <!-- TABS -->
    <div class="tabs-container" id="homeTabs">
      <div class="tab active" id="tabActive" onclick="switchTab('active')">Active</div>
      <div class="tab" id="tabHistory" onclick="switchTab('history')">History</div>
    </div>

    <!-- MAIN VIEWS -->
    <div id="activeView" class="animate-fade-in" style="padding: 0 20px;">
      <div id="listingsActive"></div>
    </div>

    <div id="historyView" class="animate-fade-in" style="display:none; padding: 0 20px;">
      <div id="listingsHistory"></div>
    </div>

    <!-- Requests view removed; accept/reject moved into Active donation cards -->

    <!-- PROFILE VIEW (HIDDEN) -->
    <div id="profileView" class="animate-fade-in" style="display:none; padding: 20px;">
      <div class="card">
        <h4 style="margin-bottom: 20px; font-weight: 700;">Profile Settings</h4>
        <!-- Profile content simplified to focus on workflow -->
        <p><strong>Name:</strong> <span id="pName"></span></p>
        <p><strong>Phone:</strong> <span id="pPhone"></span></p>
        <button class="btn btn-secondary" style="margin-top: 20px; width: 100%;" onclick="showDashboard()">Back to
          Dashboard</button>
      </div>
    </div>

    <div class="fab" id="fab" onclick="location.href='add-food.html'">
      <i class="fas fa-plus fa-lg"></i>
    </div>
  </div>

  <script>
    let currentTab = 'active';
    let allDonations = [];

    sideName.textContent = donor.name;
    sidePhone.textContent = donor.phone;

    function openMenu() { sidebar.classList.add("open"); overlay.classList.add("show") }
    function closeMenu() { sidebar.classList.remove("open"); overlay.classList.remove("show") }
    function logout() { localStorage.removeItem("donor"); location.href = "index.html" }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (tab === 'active') document.getElementById('tabActive').classList.add('active');
      if (tab === 'history') document.getElementById('tabHistory').classList.add('active');
      if (tab === 'requests') document.getElementById('tabRequests').classList.add('active');

      activeView.style.display = tab === 'active' ? 'block' : 'none';
      historyView.style.display = tab === 'history' ? 'block' : 'none';
      requestsView.style.display = tab === 'requests' ? 'block' : 'none';

      if (tab === 'requests') {
        loadRequests();
      } else {
        renderDonations();
      }
    }

    function showProfile() {
      closeMenu();
      pageTitle.textContent = "Your Profile";
      homeTabs.style.display = "none";
      activeView.style.display = "none";
      historyView.style.display = "none";
      profileView.style.display = "block";
      fab.style.display = "none";
      pName.textContent = donor.name;
      pPhone.textContent = donor.phone;
    }

    function showDashboard() {
      closeMenu();
      pageTitle.textContent = "Annadaan";
      homeTabs.style.display = "flex";
      profileView.style.display = "none";
      switchTab(currentTab);
      fab.style.display = "flex";
    }

    async function loadDonations() {
      const { data, error } = await window.sb.from('food_table')
        .select('*')
        .eq('donor_phone', donor.phone)
        .order('created_at', { ascending: false });

      if (error) return console.error(error);
      allDonations = data || [];
      renderDonations();
    }

    function renderDonations() {
      const activeContainer = document.getElementById("listingsActive");
      const historyContainer = document.getElementById("listingsHistory");

      const activeItems = allDonations.filter(d => d.status !== 'Delivered');
      const historyItems = allDonations.filter(d => d.status === 'Delivered');

      activeContainer.innerHTML = activeItems.length ? activeItems.map(d => renderCard(d)).join('') : '<div style="text-align: center; color: #94A3B8; padding: 40px;"><p>No active donations</p></div>';
      historyContainer.innerHTML = historyItems.length ? historyItems.map(d => renderCard(d)).join('') : '<div style="text-align: center; color: #94A3B8; padding: 40px;"><p>No donation history</p></div>';
    }

    function renderCard(f) {
      const statusClass = f.status === 'Picked Up' ? 'picked' : f.status === 'Delivered' ? 'completed' : 'accepted';

      const isAccepted = f.status === 'Accepted';
      const isRequested = f.status === 'NGO Requested';

      return `
        <div class="card food-card animate-fade-in" onclick="location.href='food-status.html?id=${f.id}'">
          <div class="food-img-wrapper">
            <img src="${f.photo_url || 'https://images.unsplash.com/photo-1488459711612-97435f0f0980?auto=format&fit=crop&q=80&w=200'}">
          </div>
          <div class="food-info">
            <div style="font-weight: 600; font-size: 15px;">${f.food_type}</div>
            <div style="font-size: 12px; color: var(--gray); font-weight: 600;">Serves ${f.serves} • ${new Date(f.created_at).toLocaleDateString()}</div>
            <div class="status-pill status-${statusClass}">${f.status}</div>
            
            ${isRequested ? `
              <div style="background: #F0FDF4; padding: 12px; border-radius: 12px; margin-top: 8px;">
                <div style="font-size: 12px; font-weight: 600; color: var(--primary-dark); margin-bottom: 4px;"><i class="fas fa-hands-helping"></i> NGO Contact</div>
                <div style="font-size: 14px; font-weight: 600; color: var(--dark);">${f.ngo_phone || 'NGO'}</div>
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
                <button class="btn btn-primary" onclick="event.stopPropagation(); acceptRequest('${f.id}')" style="width: 100%;">
                  <i class="fas fa-check"></i> Accept
                </button>
                <button class="btn btn-secondary" onclick="event.stopPropagation(); rejectRequest('${f.id}')" style="width: 100%; background: white; color: var(--danger); border-color: var(--danger);">
                  <i class="fas fa-times"></i> Reject
                </button>
              </div>
            ` : isAccepted ? `
              <button class="btn btn-primary" onclick="event.stopPropagation(); confirmPickup('${f.id}')" style="margin-top: 12px; width: 100%; padding: 8px; font-size: 13px;">
                <i class="fas fa-truck-pickup"></i> Confirm Pickup
              </button>
            ` : ''}
          </div>
          ${!isAccepted && !isRequested ? '<i class="fas fa-chevron-right" style="color: #E2E8F0;"></i>' : ''}
        </div>`;
    }

    async function confirmPickup(foodId) {
      if (!confirm('Has the NGO picked up this food?')) return;

      const { error } = await window.sb.from('food_table')
        .update({ status: 'Picked Up' })
        .eq('id', foodId);

      if (error) {
        console.error(error);
        alert('Error updating status');
        return;
      }

      alert('✅ Pickup Confirmed! Status updated to Picked Up.');
      loadDonations();
    }

    // Live Auto-Refresh
    setInterval(() => {
      loadDonations();
    }, 5000); // Check for updates every 5 seconds

    

    async function acceptRequest(foodId) {
      if (!confirm('Accept this NGO request? The NGO will be notified to pick up the food.')) return;

      const { error } = await window.sb.from('food_table')
        .update({ status: 'Accepted' })
        .eq('id', foodId);

      if (error) {
        console.error(error);
        alert('Error accepting request');
        return;
      }

      alert('✅ Request accepted! NGO has been notified.');
      loadDonations();
    }

    async function rejectRequest(foodId) {
      if (!confirm('Reject this NGO request? The food will become available for other NGOs.')) return;

      const { error } = await window.sb.from('food_table')
        .update({
          status: 'available',
          ngo_phone: null
        })
        .eq('id', foodId);

      if (error) {
        console.error(error);
        alert('Error rejecting request');
        return;
      }

      alert('Request rejected. Food is now available for other NGOs.');
      loadDonations();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (tab === 'active') document.getElementById('tabActive').classList.add('active');
      if (tab === 'history') document.getElementById('tabHistory').classList.add('active');

      activeView.style.display = tab === 'active' ? 'block' : 'none';
      historyView.style.display = tab === 'history' ? 'block' : 'none';

      renderDonations();
    }

    loadDonations();
  </script>
</body>

</html>
```
