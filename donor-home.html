<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donor Home</title>

<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  margin:0;
  background:#f7fbf9;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:14px 16px;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.menu{
  font-size:26px;
  cursor:pointer;
}
.title{
  margin-left:14px;
  font-size:18px;
  font-weight:600;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  top:0;
  left:-260px;
  width:260px;
  height:100%;
  background:#fff;
  box-shadow:2px 0 12px rgba(0,0,0,.15);
  transition:0.3s;
  z-index:1000;
}
.sidebar.open{
  left:0;
}
.side-header{
  padding:18px;
  background:#2f7a4e;
  color:#fff;
}
.side-header b{
  font-size:16px;
}
.side-item{
  padding:14px 18px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
.side-item:hover{
  background:#f1f1f1;
}

/* OVERLAY */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.35);
  display:none;
  z-index:999;
}
.overlay.show{
  display:block;
}

/* CONTENT */
.content{
  padding:16px;
}
.card{
  background:#fff;
  padding:16px;
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}
.food{
  display:flex;
  gap:12px;
  margin-top:12px;
}
.food img{
  width:80px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
}
.small{
  font-size:13px;
  color:#666;
}
.link{
  color:#2f7a4e;
  font-weight:600;
  cursor:pointer;
}

/* FLOATING ADD BUTTON */
.fab{
  position:fixed;
  right:24px;
  bottom:24px;
  width:64px;
  height:64px;
  background:#2f7a4e;
  color:#fff;
  font-size:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<script>
const donor = JSON.parse(localStorage.getItem("donor"));
if(!donor){
  location.href = "login.html";
}
</script>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="side-header">
    <b id="sideName"></b><br>
    <span class="small" id="sidePhone"></span>
  </div>
  <div class="side-item" onclick="goProfile()">Profile</div>
  <div class="side-item" onclick="goHome()">My Listings</div>
  <div class="side-item" onclick="logout()">Logout</div>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- HEADER -->
<div class="header">
  <div class="menu" onclick="openMenu()">☰</div>
  <div class="title">Dashboard</div>
</div>

<!-- CONTENT -->
<div class="content">
  <div class="card">
    <div id="empty" class="small">No food posted yet</div>
    <div id="list"></div>
  </div>
</div>

<!-- ADD BUTTON -->
<div class="fab" onclick="closeMenu(); location.href='add-food.html'">+</div>

<script>
/* SIDEBAR CONTROL */
function openMenu(){
  sidebar.classList.add("open");
  overlay.classList.add("show");
}
function closeMenu(){
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

/* SIDEBAR ACTIONS */
function logout(){
  closeMenu();
  localStorage.removeItem("donor");
  location.href = "index.html";
}
function goProfile(){
  closeMenu();
  alert("Profile page coming soon");
}
function goHome(){
  closeMenu();
  location.href = "donor-home.html";
}

/* USER INFO */
sideName.textContent = donor.name;
sidePhone.textContent = donor.phone;

/* LOAD FOOD LISTINGS */
const foods = JSON.parse(localStorage.getItem("foodListings") || "[]")
  .filter(f => f.donorPhone === donor.phone);

if(foods.length > 0){
  empty.style.display = "none";
  foods.reverse().forEach(f => {
    list.innerHTML += `
      <div class="food">
        <img src="${f.photo || ''}">
        <div>
          <b>${f.type} • ${f.serves} ppl</b>
          <div class="small">${f.status}</div>
          <div class="link" onclick="closeMenu(); location.href='food-status.html?id=${f.id}'">
            View Status
          </div>
        </div>
      </div>
    `;
  });
}
</script>

</body>
</html>
